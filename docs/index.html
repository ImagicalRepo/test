<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="疑問ノート">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>疑問ノート</title>
<style>
/* ============================================================
   iPadOS Human Interface Guidelines に準拠したスタイル
   - システムカラー / セマンティックカラー
   - SF Pro のテキストスタイル（Dynamic Type 対応）
   - 最小タップ領域 44pt、インセットグループドリスト
   ============================================================ */

/* ---- システムカラー（ライト） ---- */
:root{
  --blue:#007AFF; --red:#FF3B30; --orange:#FF9500; --green:#34C759;
  --indigo:#5856D6; --purple:#AF52DE; --teal:#30B0C7; --pink:#FF2D55; --brown:#A2845E;

  --label:#000000;
  --label-2:rgba(60,60,67,.60);
  --label-3:rgba(60,60,67,.30);
  --label-4:rgba(60,60,67,.18);

  --sep:rgba(60,60,67,.29);
  --sep-opaque:#C6C6C8;

  --bg-grouped:var(--theme-bg);
  --bg-grouped-2:#FFFFFF;
  --bg:#FFFFFF;
  --bg-2:var(--theme-bg);
  --bg-elevated:#FFFFFF;
  --bg-bar:var(--theme-bar);
  --bg-menu:rgba(252,252,253,.86);
  --bg-alert:rgba(250,250,251,.88);
  --bg-sidebar:var(--theme-side);
  --card-shadow:0 1px 2px rgba(22,26,40,.05),0 6px 16px -10px rgba(22,26,40,.14);

  --fill:rgba(120,120,128,.20);
  --fill-2:rgba(120,120,128,.16);
  --fill-3:rgba(118,118,128,.12);
  --fill-4:rgba(116,116,128,.08);

  --tint:var(--theme);
  --paper:#FFFFFF;
  --rule:#EAEAEF;

  /* テキストスタイル（root = body サイズ） */
  --largetitle:2.000rem; --title1:1.647rem; --title2:1.294rem; --title3:1.176rem;
  --headline:1rem; --body:1rem; --callout:.941rem; --subhead:.882rem;
  --footnote:.765rem; --caption1:.706rem; --caption2:.647rem;

  --r-cell:10px; --r-card:14px; --r-control:9px;
  --bar-h:50px;
  --margin:20px;
}
@media (prefers-color-scheme: dark){
  :root{
    --blue:#0A84FF; --red:#FF453A; --orange:#FF9F0A; --green:#30D158;
    --indigo:#5E5CE6; --purple:#BF5AF2; --teal:#40CBE0; --pink:#FF375F; --brown:#AC8E68;

    --label:#FFFFFF;
    --label-2:rgba(235,235,245,.60);
    --label-3:rgba(235,235,245,.30);
    --label-4:rgba(235,235,245,.18);

    --sep:rgba(84,84,88,.65);
    --sep-opaque:#38383A;

    --bg-grouped:var(--theme-bg);
    --bg-grouped-2:#1C1C1E;
    --bg:#000000;
    --bg-2:#1C1C1E;
    --bg-elevated:#2C2C2E;
    --bg-bar:var(--theme-bar);
    --bg-menu:rgba(48,48,52,.86);
    --bg-alert:rgba(48,48,52,.88);
    --bg-sidebar:var(--theme-side);
    --card-shadow:0 1px 2px rgba(0,0,0,.35);

    --fill:rgba(120,120,128,.36);
    --fill-2:rgba(120,120,128,.32);
    --fill-3:rgba(118,118,128,.24);
    --fill-4:rgba(118,118,128,.18);

    /* 手書きの紙は常に白のまま。ダークでも線が見え、印刷や共有でも同じに見える */
    --paper:#F6F6F4;
    --rule:#E4E4E8;
  }
}


/* ---- テーマ（8色） ---- */
:root[data-theme="sky"]{--theme:#0A78FF;--theme-bg:#EDF3FE;--theme-bar:rgba(244,248,255,.86);--theme-side:#E4EDFB}
:root[data-theme="mint"]{--theme:#0E9E86;--theme-bg:#E9F7F2;--theme-bar:rgba(242,251,248,.86);--theme-side:#DEF2EA}
:root[data-theme="lavender"]{--theme:#7566EE;--theme-bg:#F0EDFD;--theme-bar:rgba(247,245,255,.86);--theme-side:#E8E3FB}
:root[data-theme="sakura"]{--theme:#DE6391;--theme-bg:#FCEDF3;--theme-bar:rgba(254,246,250,.86);--theme-side:#F9E3EC}
:root[data-theme="apricot"]{--theme:#D97B36;--theme-bg:#FCF0E5;--theme-bar:rgba(254,248,242,.86);--theme-side:#F9E7D6}
:root[data-theme="lemon"]{--theme:#AF8E1F;--theme-bg:#FAF4DE;--theme-bar:rgba(252,249,238,.86);--theme-side:#F5EDD0}
:root[data-theme="sage"]{--theme:#6C8D62;--theme-bg:#EEF5EB;--theme-bar:rgba(247,251,245,.86);--theme-side:#E5EFE1}
:root[data-theme="slate"]{--theme:#56697E;--theme-bg:#EEF2F7;--theme-bar:rgba(247,250,252,.86);--theme-side:#E5EBF2}
@media (prefers-color-scheme:dark){
  :root[data-theme="sky"]{--theme:#5AA9FF;--theme-bg:#0E1116;--theme-bar:rgba(16,19,25,.86);--theme-side:#14181F}
  :root[data-theme="mint"]{--theme:#4FD6BA;--theme-bg:#0B1210;--theme-bar:rgba(14,22,19,.86);--theme-side:#121B18}
  :root[data-theme="lavender"]{--theme:#A996FF;--theme-bg:#101018;--theme-bar:rgba(19,19,28,.86);--theme-side:#181822}
  :root[data-theme="sakura"]{--theme:#FF93B8;--theme-bg:#170F13;--theme-bar:rgba(27,18,23,.86);--theme-side:#20161C}
  :root[data-theme="apricot"]{--theme:#FFAA63;--theme-bg:#16110C;--theme-bar:rgba(26,20,15,.86);--theme-side:#1F1813}
  :root[data-theme="lemon"]{--theme:#E8C44B;--theme-bg:#141208;--theme-bar:rgba(24,22,12,.86);--theme-side:#1D1A0F}
  :root[data-theme="sage"]{--theme:#A7C99A;--theme-bg:#0F120E;--theme-bar:rgba(19,22,17,.86);--theme-side:#171B15}
  :root[data-theme="slate"]{--theme:#9DB4CC;--theme-bg:#0E1013;--theme-bar:rgba(18,20,24,.86);--theme-side:#161A1F}
}

/* ---- 基本 ---- */
html{font-size:17px;-webkit-text-size-adjust:100%}
@supports (font:-apple-system-body){ html{font:-apple-system-body} }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;height:100%;height:100dvh;overflow:hidden;
  background:var(--bg-grouped);color:var(--label);
  font-family:-apple-system,"SF Pro Text","SF Pro Display","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:var(--body);line-height:1.29;letter-spacing:-.01em;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;line-height:1.2}
input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
[hidden]{display:none!important}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
svg.g{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.g.sm{width:17px;height:17px;stroke-width:2}
svg.g.lg{width:26px;height:26px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* タイポグラフィのユーティリティ */
.t-largetitle{font-size:var(--largetitle);font-weight:700;line-height:1.21;letter-spacing:.008em}
.t-title2{font-size:var(--title2);font-weight:700;line-height:1.27}
.t-title3{font-size:var(--title3);font-weight:600;line-height:1.25}
.t-headline{font-size:var(--headline);font-weight:600;line-height:1.29}
.t-body{font-size:var(--body);line-height:1.29}
.t-subhead{font-size:var(--subhead);line-height:1.33}
.t-footnote{font-size:var(--footnote);line-height:1.38}
.t-caption{font-size:var(--caption1);line-height:1.33}
.c2{color:var(--label-2)} .c3{color:var(--label-3)} .tint{color:var(--tint)}

/* ============================================================
   スプリットビュー（サイドバー + コンテンツ）
   ============================================================ */
.split{display:flex;height:100dvh;overflow:hidden}
.sidebar{
  width:288px;flex:0 0 288px;background:var(--bg-sidebar);
  display:flex;flex-direction:column;
  border-right:.5px solid var(--sep);
  padding-top:env(safe-area-inset-top);
  transition:margin-left .35s cubic-bezier(.32,.72,0,1);
}
.split.collapsed .sidebar{margin-left:-288px}
.content{flex:1;min-width:0;position:relative;overflow:hidden;background:var(--bg-grouped);padding-top:env(safe-area-inset-top)}

/* スタック（一覧 ⇄ ページ） */
.stack{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg-grouped)}
.stack.pushed{transform:translateX(100%);visibility:hidden;
  transition:transform .38s cubic-bezier(.32,.72,0,1),visibility .38s}
.stack.pushed.on{transform:none;visibility:visible;box-shadow:-1px 0 0 var(--sep)}
.stack.under{transition:transform .38s cubic-bezier(.32,.72,0,1)}
.stack.under.back{transform:translateX(-22%)}
@media (prefers-reduced-motion:reduce){
  .sidebar,.stack,.stack.under{transition:none}
}

.colscroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ---- ナビゲーションバー ---- */
.navbar{
  display:flex;align-items:center;gap:2px;min-height:var(--bar-h);
  padding:0 8px;background:var(--bg-bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);position:relative;z-index:5;flex:none;
}
.navbar .title{
  flex:1;min-width:0;text-align:center;font-size:var(--headline);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.navbar .lead,.navbar .trail{display:flex;align-items:center;gap:2px;min-width:44px}
.navbar .trail{justify-content:flex-end}
.navbtn{
  min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:4px;
  color:var(--tint);border-radius:8px;padding:0 6px;
}
.navbtn:active{opacity:.35}
.navbtn[disabled]{color:var(--label-3);pointer-events:none}
.navbtn.text{font-size:var(--body);padding:0 8px}
.navbtn.text svg{margin-left:-4px}
.navbtn.on{color:var(--tint)}
.navbtn.plain{color:var(--label)}

/* 大タイトル */
.largehead{padding:4px var(--margin) 10px;background:var(--bg-sidebar)}
.largehead h1{margin:0;font-size:var(--largetitle);font-weight:700;line-height:1.21;letter-spacing:.008em}

/* バー付属（検索・セグメント） */
.accessory{padding:8px max(16px,calc((100% - 952px)/2)) 10px;background:var(--bg-bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);display:flex;flex-direction:column;gap:9px;flex:none}
.searchfield{display:flex;align-items:center;gap:6px;height:36px;padding:0 8px;border-radius:10px;background:var(--fill-3);color:var(--label-2)}
.searchfield input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:var(--body);color:var(--label);-webkit-appearance:none}
.searchfield input::-webkit-search-cancel-button{display:none}
.searchfield input::placeholder{color:var(--label-2)}
.searchfield .clr{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--label-3);border-radius:50%}

/* セグメンテッドコントロール */
.segmented{display:flex;background:var(--fill-3);border-radius:var(--r-control);padding:2px;height:32px;position:relative}
.segmented button{
  flex:1;border-radius:7px;font-size:var(--footnote);font-weight:500;color:var(--label);
  display:flex;align-items:center;justify-content:center;min-width:0;white-space:nowrap;
  transition:background .2s,box-shadow .2s;
}
.segmented button[aria-selected="true"]{background:var(--bg-elevated);font-weight:600;
  box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.segmented button:not(:last-child)::after{content:"";position:absolute}

/* ============================================================
   サイドバー
   ============================================================ */
.sblist{padding:0 8px calc(16px + env(safe-area-inset-bottom))}
.sbsec{font-size:var(--footnote);font-weight:600;color:var(--label-2);padding:18px 12px 6px}
.sbrow{
  display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;
  border-radius:8px;text-align:left;font-size:var(--body);
}
.sbrow .g{color:var(--tint)}
.sbrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbrow .cnt{font-size:var(--subhead);color:var(--label-2);font-variant-numeric:tabular-nums}
.sbrow .badge{font-size:var(--footnote);font-weight:600;color:#fff;background:var(--blue);border-radius:999px;padding:2px 8px;min-width:22px;text-align:center}
.sbrow[aria-current="true"]{background:var(--fill-3);font-weight:600}
.sbrow[aria-current="true"] .g{color:var(--tint)}
.sbrow:active{background:var(--fill-4)}
.swatch{width:14px;height:14px;border-radius:50%;flex:none}

/* ============================================================
   インセットグループドリスト
   ============================================================ */
.grouped{padding:10px 0 calc(28px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.content .grouped{max-width:920px}
.gsec{margin:0 0 22px}
.ghead{font-size:var(--footnote);color:var(--label-2);padding:0 var(--margin) 7px;display:flex;align-items:baseline;gap:8px}
.ghead .more{margin-left:auto;color:var(--tint);font-size:var(--footnote)}
.gfoot{font-size:var(--footnote);color:var(--label-2);padding:7px var(--margin) 0;line-height:1.38}
.glist{background:var(--bg-grouped-2);border-radius:var(--r-card);margin:0 16px;overflow:hidden;box-shadow:var(--card-shadow)}

.cell{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:11px 16px;text-align:left;position:relative;background:none}
.cell + .cell::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep);transform:scaleY(.5)}
.cell.inset-sep + .cell::before,.cell + .cell.inset-sep::before{left:44px}
.cell:active{background:var(--fill-4)}
.cell .cbody{flex:1;min-width:0}
.cell .ctitle{font-size:var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .cvalue{font-size:var(--body);color:var(--label-2);white-space:nowrap;display:flex;align-items:center;gap:6px}
.cell .chev{color:var(--label-3);flex:none}
.cell .lead-icon{width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.cell .lead-icon svg{width:17px;height:17px;stroke-width:2}

/* ページ一覧セル */
.note{align-items:flex-start;padding:11px 16px}
.note .ntitle{font-size:var(--headline);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note .ntitle.untitled{font-weight:400;color:var(--label-2)}
.note .nsnip{font-size:var(--subhead);color:var(--label-2);margin-top:1px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.33}
.note .nmeta{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap;font-size:var(--footnote);color:var(--label-2)}
.note .nthumb{width:56px;height:56px;border-radius:6px;object-fit:cover;background:var(--fill-4);flex:none;border:.5px solid var(--sep)}
.status{display:inline-flex;align-items:center;gap:4px;font-size:var(--footnote);white-space:nowrap}
.status .dot{width:9px;height:9px;border-radius:50%;flex:none}
.st-open{color:var(--red)} .st-open .dot{background:var(--red)}
.st-wip{color:var(--orange)} .st-wip .dot{background:var(--orange)}
.st-done{color:var(--green)} .st-done .dot{background:var(--green)}
.newdot{width:10px;height:10px;border-radius:50%;background:var(--blue);flex:none;margin-right:2px}
.tagtoken{display:inline-flex;align-items:center;gap:3px;font-size:var(--footnote);color:var(--tint)}

/* 統計 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg-grouped-2);border-radius:var(--r-card);margin:0 16px;overflow:hidden;box-shadow:var(--card-shadow)}
.stat{padding:14px 8px;text-align:center;position:relative}
.stat + .stat::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:.5px;background:var(--sep)}
.stat .v{font-size:var(--title2);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:var(--caption1);color:var(--label-2);margin-top:3px}
.stat:active{background:var(--fill-4)}
@media (max-width:520px){ .stats{grid-template-columns:repeat(2,1fr)} .stat:nth-child(3)::before{display:none} }

/* クイックメモ */
.capture{background:var(--bg-grouped-2);border-radius:var(--r-card);margin:0 16px;padding:12px 16px 10px;box-shadow:var(--card-shadow)}
.capture textarea{width:100%;border:0;background:none;outline:none;resize:none;font-size:var(--body);
  min-height:56px;line-height:1.38;padding:0}
.capture textarea::placeholder{color:var(--label-2)}
.capture .row{display:flex;align-items:center;gap:8px;margin-top:6px;padding-top:9px;border-top:.5px solid var(--sep)}
.capture .row .sp{flex:1}

/* 塗りボタン */
.filled{min-height:34px;padding:0 16px;border-radius:999px;background:var(--blue);color:#fff;
  font-size:var(--subhead);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.filled:active{opacity:.7}
.filled[disabled]{background:var(--fill);color:var(--label-3)}
.tinted{min-height:34px;padding:0 14px;border-radius:999px;background:var(--fill-3);color:var(--tint);
  font-size:var(--subhead);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tinted:active{opacity:.6}
.plainbtn{min-height:44px;color:var(--tint);font-size:var(--body);display:inline-flex;align-items:center;gap:8px;padding:0 16px;width:100%}
.plainbtn.destructive{color:var(--red)}
.plainbtn.center{justify-content:center}
.plainbtn:active{background:var(--fill-4)}

/* 空表示 */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:64px 32px;text-align:center;color:var(--label-2)}
.empty svg{width:46px;height:46px;stroke-width:1.3;color:var(--label-3)}
.empty .h{font-size:var(--title3);font-weight:600;color:var(--label)}
.empty .d{font-size:var(--subhead);line-height:1.4;max-width:30ch}

/* ============================================================
   ページ（詳細）
   ============================================================ */
.doc{max-width:860px;margin:0 auto;padding:12px 16px calc(60px + env(safe-area-inset-bottom))}
.doc-title{width:100%;border:0;background:none;outline:none;font-size:var(--title2);font-weight:700;
  line-height:1.27;padding:2px 2px 4px;margin-bottom:2px;resize:none;overflow:hidden}
.doc-title::placeholder{color:var(--label-3);font-weight:400}
.doc .gsec{margin-bottom:20px}
.doc .glist{margin:0}

.tokens{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;flex:1;min-width:0}
.token{display:inline-flex;align-items:center;gap:4px;font-size:var(--subhead);color:var(--tint);
  background:var(--fill-4);border-radius:999px;padding:3px 10px}

/* 属性チップ（ステータス・業務・タグを1行に収める） */
.propbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 14px}
.pchip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;
  background:var(--bg-grouped-2);box-shadow:var(--card-shadow);font-size:var(--subhead);white-space:nowrap;
  position:relative}
.pchip::after{content:"";position:absolute;inset:-6px}
.pchip:active{opacity:.6}
.pchip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.pchip.add{color:var(--tint);padding:0 10px}
.pchip.st-open{color:var(--red)} .pchip.st-wip{color:var(--orange)} .pchip.st-done{color:var(--green)}
.pchip.tag{color:var(--tint)}

/* 親子（ツリー） */
.parentbar{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px 0 8px;border-radius:999px;
  background:var(--fill-4);color:var(--label-2);font-size:var(--footnote);margin-bottom:8px;max-width:100%}
.parentbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.parentbar:active{opacity:.6}
.cell.child{padding-left:0}
.cell .twig{width:26px;flex:none;align-self:stretch;position:relative}
.cell .twig::before{content:"";position:absolute;left:12px;top:-12px;bottom:50%;width:1.5px;background:var(--label-4)}
.cell .twig::after{content:"";position:absolute;left:12px;top:50%;width:11px;height:1.5px;background:var(--label-4)}
.cell.child.last .twig::before{bottom:50%}
.cell.d2 .twig{width:46px}
.cell.d2 .twig::before{left:32px} .cell.d2 .twig::after{left:32px}
.cell.child + .cell::before{left:42px}

/* ブロック */
.blocks{display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.block{background:var(--bg-grouped-2);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--card-shadow)}
.block-bar{display:flex;align-items:center;gap:2px;padding:2px 6px 2px 14px;min-height:34px;color:var(--label-2);font-size:var(--footnote)}
.block-bar .bk{flex:1}
.iconbtn{min-width:34px;min-height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;color:var(--tint)}
.iconbtn:active{background:var(--fill-4)}
.iconbtn[disabled]{color:var(--label-4);pointer-events:none}
.iconbtn.plain{color:var(--label-2)}
.block textarea{width:100%;border:0;background:none;outline:none;resize:none;font-size:var(--body);
  line-height:1.47;padding:2px 16px 14px;min-height:52px;display:block}
.block textarea::placeholder{color:var(--label-3)}

/* 手書き（浮動ツールパレット） */
.paper{position:relative;background:var(--paper);touch-action:none;
  background-image:repeating-linear-gradient(var(--rule) 0 .5px,transparent .5px 30px)}
canvas.pad{display:block;width:100%;height:100%;touch-action:none}
.grip{position:absolute;left:0;right:0;bottom:0;height:22px;display:flex;align-items:center;justify-content:center;
  touch-action:none;cursor:ns-resize}
.grip span{width:38px;height:4px;border-radius:2px;background:var(--label-4)}
.palette{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:flex;align-items:center;gap:2px;
  padding:5px 7px;border-radius:14px;background:var(--bg-menu);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:0 6px 20px rgba(0,0,0,.18),0 0 0 .5px var(--sep);max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
.palette::-webkit-scrollbar{display:none}
.palette .div{width:.5px;height:22px;background:var(--sep);margin:0 5px;flex:none}
.tool{min-width:38px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;color:var(--label)}
.tool[aria-pressed="true"]{background:var(--fill-3);color:var(--tint)}
.tool:active{opacity:.5}
.ink{width:26px;height:26px;border-radius:50%;flex:none;border:2px solid transparent;min-width:26px;min-height:26px;
  display:inline-flex;align-items:center;justify-content:center}
.ink i{width:20px;height:20px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
.ink[aria-pressed="true"]{border-color:var(--tint)}
.widths{display:flex;align-items:center;gap:2px}
.wbtn{min-width:34px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px}
.wbtn i{background:var(--label);border-radius:999px;display:block}
.wbtn[aria-pressed="true"]{background:var(--fill-3)}
.wbtn[aria-pressed="true"] i{background:var(--tint)}

/* チェックリスト */
.checks{padding:2px 10px 8px}
.chk{display:flex;align-items:flex-start;gap:10px;padding:5px 6px;min-height:38px}
.chkbox{width:24px;height:24px;min-width:24px;min-height:24px;border-radius:50%;border:1.6px solid var(--label-3);
  display:inline-flex;align-items:center;justify-content:center;margin-top:2px;flex:none;color:#fff;background:none}
.chk.on .chkbox{background:var(--tint);border-color:var(--tint)}
.chk.on .chkbox svg{opacity:1}
.chkbox svg{width:14px;height:14px;stroke-width:2.6;opacity:0}
.chk input[type=text]{flex:1;min-width:0;border:0;background:none;outline:none;font-size:var(--body);padding:4px 0}
.chk.on input[type=text]{color:var(--label-2);text-decoration:line-through}
.chk .rm{color:var(--label-3);min-width:34px;min-height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px}

/* 写真 */
.photo{padding:12px 16px 14px}
.photo img{display:block;max-width:100%;max-height:60vh;margin:0 auto;border-radius:8px}
.photo input{width:100%;border:0;background:none;outline:none;text-align:center;font-size:var(--footnote);
  color:var(--label-2);padding:9px 0 0}

/* 回答 */
.answer textarea{width:100%;border:0;background:none;outline:none;resize:none;font-size:var(--body);
  line-height:1.47;padding:12px 16px;min-height:88px;display:block}
.answer textarea::placeholder{color:var(--label-3)}
.answer .who{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 16px;position:relative}
.answer .who::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep);transform:scaleY(.5)}
.answer .who label{font-size:var(--body);color:var(--label)}
.answer .who input{flex:1;min-width:0;border:0;background:none;outline:none;text-align:right;font-size:var(--body);color:var(--label-2)}

/* 履歴 */
.hist summary{list-style:none;min-height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;
  font-size:var(--body);color:var(--tint);cursor:pointer}
.hist summary::-webkit-details-marker{display:none}
.hist summary .chev{transition:transform .2s;color:var(--label-3)}
.hist[open] summary .chev{transform:rotate(90deg)}
.hist ul{margin:0;padding:2px 16px 12px;list-style:none}
.hist li{font-size:var(--footnote);color:var(--label-2);padding:3px 0;display:flex;gap:10px}
.hist li b{font-weight:400;color:var(--label-3);min-width:88px;font-variant-numeric:tabular-nums}

/* ============================================================
   ポップオーバー / アクションシート / アラート / シート
   ============================================================ */
.scrim{position:fixed;inset:0;z-index:40;background:transparent}
.scrim.dim{background:rgba(0,0,0,.28)}
.sidebar-scrim{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.28)}

.popover{
  position:fixed;z-index:45;min-width:260px;max-width:340px;border-radius:13px;overflow:hidden;
  background:var(--bg-menu);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 12px 40px rgba(0,0,0,.24),0 0 0 .5px var(--sep);
  transform-origin:top right;animation:pop .22s cubic-bezier(.32,.72,0,1);
}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){ .popover{animation:none} }
.menu-item{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:9px 16px;text-align:left;font-size:var(--body);position:relative}
.menu-item + .menu-item::before{content:"";position:absolute;left:0;right:0;top:0;height:.5px;background:var(--sep);transform:scaleY(.5)}
.menu-item .mi-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.menu-item .mi-sub{display:block;font-size:var(--footnote);color:var(--label-2);line-height:1.3}
.menu-item .mi-check{color:var(--tint);opacity:0;flex:none}
.menu-item[aria-checked="true"] .mi-check{opacity:1}
.menu-item.destructive{color:var(--red)}
.menu-item:active{background:var(--fill-3)}

/* コンパクト幅ではポップオーバーをシートにする（HIG の適応） */
.sheet-wrap{position:fixed;inset:0;z-index:45;display:flex;align-items:flex-end;justify-content:center;padding:8px}
.sheet-wrap .popover{position:static;width:100%;max-width:520px;min-width:0;animation:up .32s cubic-bezier(.32,.72,0,1);transform-origin:bottom center;
  margin-bottom:calc(8px + env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

/* アラート */
.alert-wrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;padding:20px}
.alert{width:270px;border-radius:14px;overflow:hidden;text-align:center;
  background:var(--bg-alert);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .2s ease-out}
.alert .a-body{padding:19px 16px 18px}
.alert .a-title{font-size:var(--headline);font-weight:600}
.alert .a-msg{font-size:var(--footnote);margin-top:4px;line-height:1.38}
.alert .a-field{margin-top:14px;background:var(--bg);border:.5px solid var(--sep);border-radius:6px;
  height:32px;display:flex;align-items:center;padding:0 8px}
.alert .a-field input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:var(--subhead)}
.alert .a-acts{display:flex;position:relative}
.alert .a-acts::before{content:"";position:absolute;left:0;right:0;top:0;height:.5px;background:var(--sep);transform:scaleY(.5)}
.alert .a-acts button{flex:1;min-height:44px;color:var(--tint);font-size:var(--body);position:relative}
.alert .a-acts button + button::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.5px;background:var(--sep);transform:scaleX(.5)}
.alert .a-acts button.cancel{font-weight:600}
.alert .a-acts button.destructive{color:var(--red)}
.alert .a-acts button:active{background:var(--fill-3)}

/* フォームシート */
.formsheet-wrap{position:fixed;inset:0;z-index:48;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;padding:20px}
.formsheet{width:540px;max-width:100%;max-height:min(620px,86dvh);border-radius:14px;overflow:hidden;
  background:var(--bg-grouped);box-shadow:0 24px 70px rgba(0,0,0,.32);display:flex;flex-direction:column;
  animation:pop .24s cubic-bezier(.32,.72,0,1)}
.formsheet .navbar{border-radius:14px 14px 0 0}
.formsheet .fs-body{overflow-y:auto;-webkit-overflow-scrolling:touch}
.formsheet .grouped{padding-top:18px}
@media (max-width:700px){
  .formsheet-wrap{align-items:flex-end;padding:0}
  .formsheet{width:100%;max-height:92dvh;border-radius:14px 14px 0 0;animation:up .34s cubic-bezier(.32,.72,0,1)}
  .formsheet .fs-body{padding-bottom:env(safe-area-inset-bottom)}
}
@media (prefers-reduced-motion:reduce){ .formsheet,.alert,.sheet-wrap .popover{animation:none} }

/* テーマ選択 */
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px 10px}
.theme{min-height:64px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.theme i{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.10)}
.theme i::after{content:"";width:13px;height:13px;border-radius:50%;background:currentColor}
.theme span{font-size:var(--caption2);color:var(--label-2);white-space:nowrap}
.theme[aria-pressed="true"]{background:var(--fill-4)}
.theme[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--bg-grouped-2),0 0 0 4px currentColor}
.theme[aria-pressed="true"] span{color:currentColor;font-weight:600}

/* iOS スイッチ */
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;min-width:51px;border-radius:16px;
  background:var(--fill);position:relative;transition:background .22s;flex:none;margin:0}
.switch:checked{background:var(--green)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .22s cubic-bezier(.32,.72,0,1)}
.switch:checked::after{transform:translateX(20px)}
@media (prefers-reduced-motion:reduce){ .switch,.switch::after{transition:none} }

/* テキストフィールド行 */
.cell input.tf{flex:1;min-width:0;border:0;background:none;outline:none;font-size:var(--body);text-align:right;color:var(--label-2)}
.cell input.tf::placeholder{color:var(--label-3)}
.catrow{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:7px 16px;position:relative}
.catrow + .catrow::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep);transform:scaleY(.5)}
.catrow input[type=color]{width:30px;height:30px;min-width:30px;border:0;padding:0;background:none;border-radius:50%;flex:none}
.catrow input[type=text]{flex:1;min-width:0;border:0;background:none;outline:none;font-size:var(--body)}

/* HUD（保存などの短い通知） */
.hud{position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translateX(-50%) scale(.96);
  z-index:60;padding:11px 20px;border-radius:999px;max-width:88vw;text-align:center;
  background:var(--bg-menu);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:0 8px 28px rgba(0,0,0,.2),0 0 0 .5px var(--sep);
  font-size:var(--subhead);opacity:0;pointer-events:none;transition:opacity .24s,transform .24s}
.hud.on{opacity:1;transform:translateX(-50%) scale(1)}

/* ============================================================
   コンパクト幅
   ============================================================ */
.compact-only{display:none}
@media (max-width:768px){
  .sidebar{position:fixed;top:0;bottom:0;left:0;z-index:26;margin-left:-288px;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .split.show-sidebar .sidebar{margin-left:0}
  .compact-only{display:inline-flex}
  :root{--margin:16px}
  .glist,.stats,.capture{margin-left:12px;margin-right:12px}
}
@media (min-width:769px){ .sidebar-scrim{display:none} }

/* ============================================================
   FAQ 印刷
   ============================================================ */
#printView{display:none}
@media print{
  body *{visibility:hidden}
  #printView,#printView *{visibility:visible}
  #printView{display:block;position:absolute;left:0;top:0;width:100%;padding:24px;background:#fff;color:#000;font-size:11pt}
  #printView h2{font-size:16pt;margin:0 0 2px}
  .pq{page-break-inside:avoid;border-top:1px solid #d0d0d0;padding:12px 0}
  .pq h4{margin:0 0 3px;font-size:12pt}
  .pq .pm{font-size:9pt;color:#666}
  .pq .pa{white-space:pre-wrap;font-size:10.5pt;margin-top:5px;line-height:1.5}
  .pq img{max-width:55%;display:block;border:1px solid #ddd;margin:6px 0}
}

<div class="split" id="split">

  <!-- ===================== サイドバー ===================== -->
  <aside class="sidebar" id="sidebar">
    <div class="navbar" style="background:var(--bg-sidebar);border-bottom:0">
      <div class="lead"></div>
      <div class="title" style="opacity:0">疑問ノート</div>
      <div class="trail"><button class="navbtn" id="btnSettings" aria-label="設定"><svg class="g"><use href="#i-gear"/></svg></button></div>
    </div>
    <div class="largehead"><h1>疑問ノート</h1></div>
    <div class="colscroll"><nav class="sblist" id="sbList" aria-label="コレクション"></nav></div>
  </aside>
  <div class="sidebar-scrim" id="sidebarScrim" hidden></div>

  <!-- ===================== コンテンツ ===================== -->
  <div class="content">

    <!-- 一覧 -->
    <section class="stack under" id="listStack">
      <header class="navbar">
        <div class="lead">
          <button class="navbtn" id="btnSidebar" aria-label="サイドバーを表示"><svg class="g"><use href="#i-sidebar"/></svg></button>
        </div>
        <h2 class="title" id="listTitle">ホーム</h2>
        <div class="trail">
          <button class="navbtn" id="btnListMenu" aria-label="その他の操作"><svg class="g"><use href="#i-ellipsis"/></svg></button>
          <button class="navbtn" id="btnCompose" aria-label="新しいページ"><svg class="g"><use href="#i-compose"/></svg></button>
        </div>
      </header>
      <div class="accessory" id="listAccessory">
        <div class="searchfield">
          <svg class="g sm"><use href="#i-search"/></svg>
          <input id="searchField" type="search" placeholder="検索" autocomplete="off" enterkeyhint="search" aria-label="ページを検索">
          <button class="clr" id="searchClear" aria-label="検索語を消去" hidden><svg class="g sm"><use href="#i-xcircle"/></svg></button>
        </div>
        <div class="segmented" id="segStatus" role="tablist" aria-label="ステータスで絞り込む">
          <button role="tab" data-s="" aria-selected="true">すべて</button>
          <button role="tab" data-s="open" aria-selected="false">未解決</button>
          <button role="tab" data-s="wip" aria-selected="false">確認中</button>
          <button role="tab" data-s="done" aria-selected="false">解決</button>
        </div>
      </div>
      <div class="colscroll" id="listScroll">
        <div class="grouped" id="home"></div>
        <div class="grouped" id="list" hidden></div>
      </div>
    </section>

    <!-- ページ -->
    <section class="stack pushed" id="pageStack" aria-hidden="true">
      <header class="navbar">
        <div class="lead">
          <button class="navbtn text" id="btnBack"><svg class="g"><use href="#i-chev-l"/></svg><span id="backLabel">一覧</span></button>
        </div>
        <h2 class="title" id="pageTitle"></h2>
        <div class="trail">
          <button class="navbtn" id="btnPin" aria-label="ピン留め"><svg class="g"><use href="#i-pin"/></svg></button>
          <button class="navbtn" id="btnShare" aria-label="このページを共有"><svg class="g"><use href="#i-share"/></svg></button>
          <button class="navbtn" id="btnPageMenu" aria-label="その他の操作"><svg class="g"><use href="#i-ellipsis"/></svg></button>
        </div>
      </header>
      <div class="colscroll" id="pageScroll">
        <div class="doc" id="doc"></div>
      </div>
    </section>

  </div>
</div>

<input type="file" id="imgFile" accept="image/*" hidden>
<input type="file" id="fileImport" accept="application/json,.json" hidden>
<div id="printView"></div>
<div class="hud" id="hud" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
