<!-- version: 1.7.0 -->
<!-- テンプレートの書き出し／読み込み -->
<style>
  * { box-sizing:border-box; }
  body {
    font-family:"Noto Sans JP","Yu Gothic","Hiragino Sans",system-ui,sans-serif;
    font-size:13px; color:#202124; margin:0; padding:14px;
    display:flex; flex-direction:column; height:100vh;
  }
  h1 { font-size:14px; margin:0 0 6px; }
  p { font-size:11.5px; color:#5f6368; line-height:1.6; margin:0 0 10px; }
  textarea {
    flex:1; width:100%; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px;
    border:1px solid #e0e3e7; border-radius:8px; padding:10px; resize:none; line-height:1.5;
  }
  .row { display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  button {
    font-family:inherit; font-size:12px; cursor:pointer; padding:6px 12px;
    border:1px solid #e0e3e7; border-radius:6px; background:#fff;
  }
  button.primary { background:#1a73e8; border-color:#1a73e8; color:#fff; }
  label { font-size:12px; display:flex; align-items:center; gap:4px; }
  #msg { font-size:12px; }
  #msg.err { color:#d93025; }
  #msg.warn { color:#b06000; font-weight:600; }
  button.danger { background:#d93025; border-color:#d93025; color:#fff; }
  .ver { font-size:11px; color:#9aa0a6; font-variant-numeric:tabular-nums; }
  [hidden] { display:none !important; }
  .spacer { flex:1; }
</style>

<? if (mode === 'export') { ?>
  <h1>テンプレートの書き出し</h1>
  <p>業務マスタと工程テンプレートを JSON で書き出します。<b>個人情報は含まれません</b>。
     このテキストをコピーして渡せば、相手のシートで同じスケジュール定義を再現できます。<br>
     別のシートへ引っ越すときや控えを取るときは、下の「進捗も含める」を入れてください。</p>
<? } else { ?>
  <h1>テンプレートの読み込み</h1>
  <p>受け取った JSON を貼り付けて読み込みます。基準日・進捗・休日マスタはそのまま残り、
     業務マスタと工程テンプレートだけが更新されます。</p>
<? } ?>

<textarea id="box" spellcheck="false"><?= payload ?></textarea>

<div class="row">
  <? if (mode === 'export') { ?>
    <label title="各工程の状態と完了日を含めます。他の団体へ定義だけを渡すときは外してください">
      <input type="checkbox" id="withProgress"> 進捗（状態・完了日）も含める</label>
    <span class="spacer"></span>
    <button class="primary" id="btnCopy">コピー</button>
    <button id="btnClose">閉じる</button>
  <? } else { ?>
    <label><input type="radio" name="mode" value="merge" checked> 同じ業務IDだけ上書き</label>
    <label><input type="radio" name="mode" value="replace"> 既存を全部消して入れ替え</label>
    <span class="spacer"></span>
    <button id="btnCancel" hidden>やめる</button>
    <button class="primary" id="btnImport">読み込む</button>
  <? } ?>
  <span id="msg"></span>
  <span class="spacer"></span>
  <!-- コード.gs 側の版。画面だけ古いまま貼り替え忘れていないかを見分ける -->
  <span class="ver" title="コード.gs の版。この画面が対応していない版だと、ここが出ません">版 <?= version ?></span>
</div>

<script>
  function setMsg(t, kind) {
    var m = document.getElementById('msg');
    if (!m) return;
    m.textContent = t;
    m.className = kind === true ? 'err' : (kind || '');
  }

  /**
   * このダイアログでは開発者ツールを開けないことが多く、JS が落ちても
   * 「押しても何も起きない」としか分からない。画面と実行ログの両方に出す。
   */
  function reportError(where, e) {
    var text = where + '：' + ((e && e.message) || e);
    setMsg(text, true);
    try {
      google.script.run.logClientError('テンプレート受け渡し', text);
    } catch (ignore) { /* 送れなくても画面には出ている */ }
  }
  window.onerror = function (msg, src, line, col) {
    reportError('画面のエラー（' + line + ':' + col + '）', msg);
  };

  // どちらの画面かは、置かれているボタンで判断する。
  // スクリプトレットをこの中に書くと、書き出され方によっては JS ごと壊れ、
  // 「押しても何も起きない」になるため、テンプレートの出力は混ぜない。
  var isExport = !!document.getElementById('btnCopy');

  if (isExport) {
    var copyBtn = document.getElementById('btnCopy');
    var withProgress = document.getElementById('withProgress');

    copyBtn.onclick = function () {
      var box = document.getElementById('box');
      box.select();
      box.setSelectionRange(0, box.value.length);
      try {
        document.execCommand('copy');
        setMsg('コピーしました');
      } catch (e) {
        setMsg('コピーできませんでした。手動で選択してください。', true);
      }
    };
    document.getElementById('btnClose').onclick = function () { google.script.host.close(); };

    // 進捗の有無で中身が変わるので、切り替えたら書き出し直す
    if (withProgress) {
      withProgress.onchange = function () {
        var on = withProgress.checked;
        withProgress.disabled = true;
        copyBtn.disabled = true;
        setMsg('書き出し中…');
        google.script.run
          .withSuccessHandler(function (text) {
            document.getElementById('box').value = text;
            withProgress.disabled = false;
            copyBtn.disabled = false;
            setMsg(on ? '進捗を含めました' : '進捗を外しました');
          })
          .withFailureHandler(function (e) {
            withProgress.checked = !on;
            withProgress.disabled = false;
            copyBtn.disabled = false;
            reportError('書き出し', e);
          })
          .exportTemplatesJson(on);
      };
    }
  } else {
    var btn = document.getElementById('btnImport');
    var cancel = document.getElementById('btnCancel');
    var armed = false;   // 「入れ替え」は2回押しで確認する

    function disarm() {
      armed = false;
      btn.textContent = '読み込む';
      btn.className = 'primary';
      if (cancel) cancel.hidden = true;
      setMsg('');
    }

    // ボタンの割り当てを最初に済ませる。ここより前で何か落ちると
    // 「押しても何も起きない」になり、原因が分からなくなる
    btn.addEventListener('click', function () {
      try {
        onImportClick();
      } catch (e) {
        btn.disabled = false;
        reportError('読み込みの開始', e);
      }
    });

    if (cancel) cancel.onclick = disarm;
    Array.prototype.forEach.call(document.querySelectorAll('input[name=mode]'),
      function (r) { r.onchange = disarm; });

    function onImportClick() {
      var picked = document.querySelector('input[name=mode]:checked');
      var mode = picked ? picked.value : 'merge';

      // window.confirm はこのダイアログ（サンドボックス化された iframe）では
      // 無視されて押しても何も起きないため、ボタン自体を2段階にしている
      if (mode === 'replace' && !armed) {
        armed = true;
        btn.textContent = '本当に入れ替える';
        btn.className = 'danger';
        if (cancel) cancel.hidden = false;
        setMsg('既存の業務マスタと工程テンプレートをすべて削除します', 'warn');
        return;
      }

      var text = document.getElementById('box').value.trim();
      if (!text) { setMsg('JSON を貼り付けてください。', true); return; }

      // 工程が多いと1分以上かかる。押せたことがはっきり分かるようにする
      btn.disabled = true;
      btn.textContent = '読み込み中…';
      if (cancel) cancel.hidden = true;
      setMsg('工程表を作り直しています。しばらくお待ちください。');
      // 応答が返らないまま黙って止まると原因が分からないので、待ちに上限を置く
      var watchdog = setTimeout(function () {
        btn.disabled = false;
        disarm();
        setMsg('応答がありません。［実行ログ］シートを確認してください。', true);
      }, 90000);
      google.script.run
        .withSuccessHandler(function (res) {
          clearTimeout(watchdog);
          btn.disabled = false;
          disarm();
          var p = res.progress;
          setMsg('読み込みました（工程表 ' + res.rows + ' 行）'
            + (p ? '　進捗 ' + p.applied + ' 件を復元'
                + (p.missing ? '（' + p.missing + ' 件は該当する工程がありません）' : '') : '')
            + (res.errors && res.errors.length ? ' 要確認: ' + res.errors.join(' / ') : ''),
            (res.errors && res.errors.length) || (p && p.missing) ? true : false);
        })
        .withFailureHandler(function (e) {
          clearTimeout(watchdog);
          btn.disabled = false;
          disarm();
          setMsg(e.message, true);
        })
        .importTemplatesJson(text, mode);
    }
  }
</script>
