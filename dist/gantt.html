function drawGantt(grid) {
  grid.innerHTML = '';
  // 紙ではラベル列を狭くするので、網掛けと目盛りの原点もそれに合わせる
  var labelW = printing ? PRINT_LABEL_W : LABEL_W;
  var trackW = days.length * dayW;
  grid.style.width = (labelW + trackW) + 'px';

  var bg = el('div', 'bg-layer');
  bg.style.left = labelW + 'px';
  bg.style.width = trackW + 'px';
  days.forEach(function (k, i) {
    if (!isOff(k)) return;
    var c = el('div', 'bg-cell');
    c.style.left = (i * dayW) + 'px';
    c.style.width = dayW + 'px';
    bg.appendChild(c);
  });

  // 紙は網掛けだけだと区切りが読めないので、日・週・月の罫線を引く。
  // 画面はマスの色分けで足りているため引かない。
  if (printing) {
    days.forEach(function (k, i) {
      if (!i) return;
      var cls = 'vline';
      if (monthOf(k) !== monthOf(days[i - 1])) cls += ' month';
      else if (toDate(k).getUTCDay() === 1) cls += ' week';
      else if (dayW < 9) return;      // 細かすぎるときは日の線を省く
      var v = el('div', cls);
      v.style.left = (i * dayW) + 'px';
      bg.appendChild(v);
    });
  }

  if (indexOf[DATA.today] !== undefined) {
    var line = el('div', 'today-line');
    line.style.left = (indexOf[DATA.today] * dayW + dayW / 2) + 'px';
    bg.appendChild(line);
  }
  grid.appendChild(bg);

  var head = el('div', 'head');
  var monthRow = el('div', 'head-row');
  monthRow.appendChild(el('div', 'head-label'));
  var m = 0, prevYear = '';
  while (m < days.length) {
    var ym = monthOf(days[m]);
    var n = 0;
    while (m + n < days.length && monthOf(days[m + n]) === ym) n++;
    // 年は変わったときだけ添える。毎月付けると同じ数字が並んで読みにくい
    var year = ym.slice(0, 4);
    var label = (+ym.slice(5, 7)) + '月' + (year === prevYear ? '' : '　' + year);
    prevYear = year;
    var cell = el('div', 'month-cell', label);
    cell.style.flex = '0 0 ' + (n * dayW) + 'px';
    monthRow.appendChild(cell);
    m += n;
  }
  head.appendChild(monthRow);

  // マスは背景と当たり判定だけを持たせ、日付の文字は上に重ねた層に置く。
  // マスの中に入れると、1日の幅が狭いときに隣のマスの背景で数字が欠ける。
  var dayRow = el('div', 'head-row');
  dayRow.appendChild(el('div', 'head-label'));
  days.forEach(function (k) {
    var cls = 'day';
    if (isOff(k)) cls += ' we';
    if (k === DATA.today) cls += ' today';
    var c = el('div', cls);
    c.style.flex = '0 0 ' + dayW + 'px';
    c.title = fmtLong(k) + (holidayName[k] ? '　' + holidayName[k] : '');
    dayRow.appendChild(c);
  });
  head.appendChild(dayRow);

  var ticks = el('div', 'tick-layer');
  ticks.style.left = labelW + 'px';
  ticks.style.width = trackW + 'px';
  // 数字が入る幅があれば毎日、狭ければ月曜だけに間引く。
  // 紙は文字が小さいぶん、画面より狭くても毎日入る
  var tickEvery = printing ? 13 : 20;
  days.forEach(function (k, i) {
    if (dayW < tickEvery && toDate(k).getUTCDay() !== 1) return;
    var t = el('span', 'tick' + (k === DATA.today ? ' today' : ''), String(+k.slice(8, 10)));
    t.style.left = (i * dayW + dayW / 2) + 'px';
    ticks.appendChild(t);
  });
  head.appendChild(ticks);
  grid.appendChild(head);

  var shown = visibleLanes();
  if (!shown.length) {
    grid.appendChild(el('div', 'empty', filterOn()
      ? '絞り込みに当てはまる工程はありません。検索欄を空にするか、担当を「すべて」に戻してください。'
      : '表示できる工程がありません。凡例で業務を表示に戻すか、［工程表を再生成］を実行してください。'));
    fitLanes(grid, 0);
    return;
  }

  laneRoom(grid);
  showLabels = !printing && labelsOn;
  document.body.classList.toggle('labels', showLabels);

  shown.forEach(function (lane, li) {
    var repeat = li > 0 && shown[li - 1].workId === lane.workId;
    grid.appendChild(renderLane(lane, trackW, li, repeat));
  });

  if (showLabels || printing) layoutLabels();
  if (!printing) spreadLanes(grid);
}

/** 余白を分けるとき、1行に足してよい上限。全部を分けると間延びして読みづらい */
var LANE_GROW = 48;

/** 行の高さの下限を置く。紙は行数がそのまま高さになるので指定しない */
function laneRoom(grid) {
  if (printing) grid.style.removeProperty('--lane-h');
  else grid.style.setProperty('--lane-h', laneH + 'px');
}

/**
 * 画面の下に余白が残るとき、各行に少しずつ分けて広げる。
 *
 * 余りを全部分けると、工程が1つしかない行まで縦に伸びて間延びするので、
 * 1行あたり LANE_GROW までにとどめる。埋めきらない余白はそのまま残す
 * （表示する月数を増やせば、行そのものが増えて埋まる）。
 */
function spreadLanes(grid) {
  var lanes = grid.querySelectorAll('.lane');
  var sc = grid.parentNode;
  if (!lanes.length || !sc) return;
  var add = Math.min(Math.floor((sc.clientHeight - grid.offsetHeight - 4) / lanes.length), LANE_GROW);
  if (add <= 0) return;
  // 行に padding を足すと、その帯だけ土日の網掛けが業務名の列にはみ出して
  // 見えてしまう（ラベルは中身の高さぶんしか覆わないため）。高さだけを足す。
  Array.prototype.forEach.call(lanes, function (l) {
    l.style.minHeight = (l.offsetHeight + add) + 'px';
  });
}

function renderLane(lane, trackW, laneIndex, repeat) {
  var color = hues(lane.color);
  var row = el('div', 'lane');

  var label = el('div', 'lane-label');
  var title = el('div', 'lane-title' + (repeat ? ' repeat' : ''));
  var sw = el('span', 'swatch');
  sw.style.background = color.bar;
  title.appendChild(sw);
  title.appendChild(document.createTextNode(lane.workName));
  label.appendChild(title);

  var sub = el('div', 'lane-sub');
  sub.appendChild(el('span', 'period', periodLabel(lane.period)));
  if (lane.anchorKey) {
    var a = el('a', '', lane.anchorName + ' ' + fmtShort(lane.anchorKey));
    a.title = '基準日を変更する';
    a.onclick = function (ev) { ev.stopPropagation(); changeAnchor(lane); };
    sub.appendChild(a);
  }
  sub.appendChild(el('span', '', lane.doneCount + '/' + lane.items.length));
  label.appendChild(sub);
  row.appendChild(label);

  var track = el('div', 'track');
  track.style.width = trackW + 'px';

  var fi = indexOf[lane.from], ti = indexOf[lane.to];
  if (fi !== undefined && ti !== undefined && ti > fi) {
    var span = el('div', 'span');
    span.style.left = (fi * dayW + dayW / 2) + 'px';
    span.style.width = ((ti - fi) * dayW) + 'px';
    span.style.background = color.soft;
    span.style.animationDelay = delay(laneIndex, 45, 400);
    track.appendChild(span);
  }

  laneItems(lane).forEach(function (it, ii) {
    var i = indexOf[it.dueKey];
    if (i === undefined) return;

    // 期間を持つ工程は、開始から終了までを帯で描く
    if (it.endKey) {
      var ei = indexOf[it.endKey];
      if (ei === undefined) ei = days.length - 1;
      var bar = el('div', 'range' + (it.status === '完了' ? ' done' : '') + (it.overdue ? ' overdue' : ''));
      bar.style.left = (i * dayW + dayW / 2) + 'px';
      bar.style.width = Math.max((ei - i) * dayW, 6) + 'px';
      bar.style.background = color.bar;
      bar.style.animationDelay = delay(laneIndex * 3 + ii, 14, 500);
      bar.title = fmtShort(it.dueKey) + '〜' + fmtShort(it.endKey) + '　' + it.name;
      bar.onclick = function (ev) { ev.stopPropagation(); openDetail(ev, { lane: lane, item: it }); };
      track.appendChild(bar);
    }

    var cls = 'mark';
    if (it.isAnchor) cls += ' anchor';
    if (it.status === '完了') cls += ' done';
    else if (it.overdue) cls += ' overdue';
    var mk = el('div', cls);
    mk.style.left = (i * dayW + dayW / 2 - (it.isAnchor ? 7.5 : 6.5)) + 'px';
    mk.style.background = color.bar;
    mk.style.animationDelay = delay(laneIndex * 3 + ii, 14, 500);
    mk.title = (it.endKey ? fmtShort(it.dueKey) + '〜' + fmtShort(it.endKey) : fmtShort(it.dueKey))
      + '　' + it.name;
    mk.onclick = function (ev) { ev.stopPropagation(); openDetail(ev, { lane: lane, item: it }); };
    track.appendChild(mk);

    if (printing || showLabels) {
      var lab = el('div', 'plabel');
      lab.appendChild(el('span', 'pdate', it.endKey
        ? shortMD(it.dueKey) + '〜' + shortMD(it.endKey)
        : shortMD(it.dueKey)));
      lab.appendChild(document.createTextNode(it.name));
      lab.dataset.x = String(i * dayW + dayW / 2);
      lab.style.borderColor = color.bar;
      track.appendChild(lab);
    }
  });

  row.appendChild(track);
  return row;
}

function scrollToToday() {
  var sc = document.getElementById('scroll');
  var i = indexOf[DATA && DATA.today];
  if (!sc || i === undefined) return;
  sc.scrollTo({ left: Math.max(0, i * dayW - sc.clientWidth / 3), behavior: 'smooth' });
}

// =====================================================================
// ビュー2：業務別（1つの業務が回次ごとにどう流れるか）
// =====================================================================
function renderWorkView(root) {
  var wrap = el('div', 'view');

  var bar = el('div', 'legend');
  DATA.works.filter(function (w) { return w.enabled; }).forEach(function (w) {
    var chip = el('span', 'chip' + (w.id === selectedWork ? ' sel' : ''));
    var dot = el('span', 'dot');
    dot.style.background = hues(w.color).bar;
    chip.appendChild(dot);
    chip.appendChild(document.createTextNode(w.name));
    chip.onclick = function () { selectedWork = w.id; renderView(); };
    bar.appendChild(chip);
  });
  wrap.appendChild(bar);
  var note = filterNote();
  if (note) wrap.appendChild(note);

  var scroll = el('div', 'work-scroll');
  var lanes = DATA.lanes.filter(function (l) {
    return l.workId === selectedWork && laneItems(l).length;
  });
  if (!lanes.length) {
    scroll.appendChild(el('div', 'empty', 'この業務には表示できる回次がありません。'));
  }
  lanes.forEach(function (lane, li) {
    scroll.appendChild(renderKase(lane, li));
  });
  wrap.appendChild(scroll);
  root.appendChild(wrap);
}

function renderKase(lane, laneIndex) {
  var color = hues(lane.color);
  var box = el('div', 'kase');
  box.style.animationDelay = delay(laneIndex, 60, 400);

  var head = el('div', 'kase-head');
  var sw = el('span', 'swatch');
  sw.style.background = color.bar;
  sw.style.height = '18px';
  head.appendChild(sw);
  head.appendChild(el('span', 'kase-period', periodLabel(lane.period)));

  if (lane.anchorKey) {
    var an = el('span', 'kase-anchor');
    an.appendChild(document.createTextNode(lane.anchorName + '　'));
    var a = el('a', '', fmtShort(lane.anchorKey));
    a.title = '基準日を変更する';
    a.onclick = function () { changeAnchor(lane); };
    an.appendChild(a);
    head.appendChild(an);
  }

  var prog = el('div', 'progress');
  var bar = el('i');
  bar.style.background = color.bar;
  bar.style.width = '0%';
  prog.appendChild(bar);
  head.appendChild(prog);
  head.appendChild(el('span', 'kase-count', lane.doneCount + ' / ' + lane.items.length + ' 完了'));

  // 回次まるごとの操作。年度途中の登録や、今回は該当なしの回で使う
  var bulk = el('div', 'kase-bulk');
  var bDone = el('button', '', 'まとめて完了');
  bDone.type = 'button';
  bDone.title = 'この回次の工程をすべて完了にします';
  bDone.onclick = function () { bulkStatus(lane, '完了', bDone); };
  bulk.appendChild(bDone);
  var bSkip = el('button', '', 'この回次を対象外');
  bSkip.type = 'button';
  bSkip.title = 'この回次の工程をすべて対象外にします（通知にも出なくなります）';
  bSkip.onclick = function () { bulkStatus(lane, '対象外', bSkip); };
  bulk.appendChild(bSkip);
  head.appendChild(bulk);
  box.appendChild(head);

  // プログレスバーは描画後に伸ばす（アニメーションさせるため）
  var pct = lane.items.length ? Math.round(lane.doneCount / lane.items.length * 100) : 0;
  setTimeout(function () { bar.style.width = pct + '%'; }, 80 + laneIndex * 60);

  var steps = el('div', 'steps');
  laneItems(lane).forEach(function (it, ii) {
    steps.appendChild(renderStep(lane, it, ii, color));
  });
  box.appendChild(steps);
  return box;
}

function renderStep(lane, it, ii, color) {
  var done = it.status === '完了';
  var isToday = it.dueKey === DATA.today;
  var cls = 'row-item' + (done ? ' done' : '') + (isToday && !done ? ' today' : '');
  var row = el('div', cls);
  row.style.animationDelay = delay(ii, 22, 420);

  var rail = el('div', 'rail');
  var dot = el('i');
  dot.style.background = done ? 'var(--surface-3)' : color.bar;
  if (it.isAnchor) { dot.style.borderRadius = '2px'; dot.style.transform = 'rotate(45deg)'; }
  rail.appendChild(dot);
  row.appendChild(rail);

  var dateCell = el('div', 'row-date' + (it.endKey ? ' wide' : ''),
    it.endKey ? fmtShort(it.dueKey) + '〜' + fmtShort(it.endKey) : fmtShort(it.dueKey));
  row.appendChild(dateCell);

  var name = el('div', 'row-name');
  name.appendChild(el('span', 'row-label', it.name));
  if (it.owner) {
    var ow = el('span', 'row-owner', '　' + it.owner);
    name.appendChild(ow);
  }
  row.appendChild(name);

  var pillCls = 'pill';
  var pillText = it.status;
  if (done) pillCls += ' done';
  else if (it.overdue) { pillCls += ' overdue'; pillText = Math.abs(it.remaining) + '営業日超過'; }
  else if (isToday) { pillCls += ' today'; pillText = '本日'; }
  else pillText = 'あと' + it.remaining + '営業日';
  row.appendChild(el('span', pillCls, pillText));

  row.onclick = function (ev) { openDetail(ev, { lane: lane, item: it }); };
  return row;
}

// =====================================================================
// ビュー3：月間カレンダー（複数業務が混ざった状態を見る）
// =====================================================================
function renderMonth(root) {
  var wrap = el('div', 'view');

  var bar = el('div', 'cal-bar');
  var prev = el('button', '', '◀');
  var next = el('button', '', '▶');
  var title = el('span', 'cal-title', (+calMonth.slice(5, 7)) + '月　' + calMonth.slice(0, 4));
  prev.disabled = calMonth <= monthOf(DATA.from);
  next.disabled = calMonth >= monthOf(DATA.to);
  prev.onclick = function () { calMonth = shiftMonth(calMonth, -1); expandedCells = {}; renderView(); };
  next.onclick = function () { calMonth = shiftMonth(calMonth, 1); expandedCells = {}; renderView(); };
  bar.appendChild(prev);
  bar.appendChild(title);
  bar.appendChild(next);
  var btnNow = el('button', '', '今月');
  btnNow.onclick = function () { calMonth = monthOf(DATA.today); expandedCells = {}; renderView(); };
  bar.appendChild(btnNow);

  wrap.appendChild(bar);

  var legend = el('div', 'legend');
  DATA.works.filter(function (w) { return w.enabled; }).forEach(function (w) {
    var chip = el('span', 'chip' + (hidden[w.id] ? ' off' : ''));
    var dot = el('span', 'dot');
    dot.style.background = hues(w.color).bar;
    chip.appendChild(dot);
    chip.appendChild(document.createTextNode(w.name));
    chip.onclick = function () { hidden[w.id] = !hidden[w.id]; renderView(); };
    legend.appendChild(chip);
  });
  wrap.appendChild(legend);
  var note = filterNote();
  if (note) wrap.appendChild(note);

  // 日付ごとに工程を集める
  var byDate = {};
  DATA.lanes.forEach(function (lane) {
    if (hidden[lane.workId]) return;
    laneItems(lane).forEach(function (it) {
      if (!byDate[it.dueKey]) byDate[it.dueKey] = [];
      // 期間を持つ工程は、開始日と終了日の両方に出す（間の日は埋めない）
      byDate[it.dueKey].push({ lane: lane, item: it, edge: it.endKey ? 'start' : '' });
      if (it.endKey && it.endKey !== it.dueKey) {
        if (!byDate[it.endKey]) byDate[it.endKey] = [];
        byDate[it.endKey].push({ lane: lane, item: it, edge: 'end' });
      }
    });
  });
  Object.keys(byDate).forEach(function (k) {
    byDate[k].sort(function (a, b) {
      if (a.lane.workId !== b.lane.workId) return a.lane.workId < b.lane.workId ? -1 : 1;
      return a.item.seq - b.item.seq;
    });
  });

  var calWrap = el('div', 'cal-wrap');
  var head = el('div', 'cal-head');
  WD.forEach(function (w, i) {
    head.appendChild(el('div', i === 0 ? 'sun' : i === 6 ? 'sat' : '', w));
  });
  calWrap.appendChild(head);

  var grid = el('div', 'cal-grid');
  var first = calMonth + '-01';
  var start = addDays(first, -toDate(first).getUTCDay());
  var lastDay = new Date(Date.UTC(+calMonth.slice(0, 4), +calMonth.slice(5, 7), 0)).getUTCDate();
  var end = calMonth + '-' + (lastDay < 10 ? '0' : '') + lastDay;
  var weeks = Math.ceil((Math.round((toDate(end) - toDate(start)) / 86400000) + 1) / 7);

  for (var i = 0; i < weeks * 7; i++) {
    grid.appendChild(renderCell(addDays(start, i), byDate, i));
  }
  calWrap.appendChild(grid);
  wrap.appendChild(calWrap);
  root.appendChild(wrap);

  calWrap.addEventListener('click', function (ev) {
    if (!ev.target.closest('.ev')) closeDetail();
  });
}

/** セルの高さに応じて、畳んだ状態で見せる件数を決める */
function cellChipLimit() {
  var h = window.innerHeight || 800;
  if (h < 620) return 1;
  if (h < 780) return 2;
  return 3;
}

function renderCell(key, byDate, i) {
  var inMonth = monthOf(key) === calMonth;
  var cls = 'cell';
  if (!inMonth) cls += ' out';
  if (isOff(key)) cls += ' we';
  if (key === DATA.today) cls += ' today';
  var cell = el('div', cls);
  cell.style.animationDelay = delay(i, 9, 380);

  var head = el('div', 'cell-head');
  head.appendChild(el('span', 'cell-num', String(+key.slice(8, 10))));
  if (holidayName[key]) head.appendChild(el('span', 'cell-hol', holidayName[key]));
  cell.appendChild(head);

  var list = byDate[key] || [];
  var limit = expandedCells[key] ? list.length : cellChipLimit();
  list.slice(0, limit).forEach(function (ctx, n) {
    var color = hues(ctx.lane.color);
    var done = ctx.item.status === '完了';
    var ev = el('div', 'ev' + (done ? ' done' : '') + (ctx.item.overdue ? ' overdue' : ''));
    ev.style.background = color.soft;
    ev.style.color = 'var(--text)';
    ev.style.animationDelay = delay(i * 2 + n, 10, 430);
    var dot = el('i');
    dot.style.background = color.bar;
    ev.appendChild(dot);
    var label = ctx.item.name;
    if (ctx.edge === 'start') label = label + ' 〜';
    else if (ctx.edge === 'end') label = '〜 ' + label;
    ev.appendChild(el('span', '', label));
    ev.title = ctx.lane.workName + ' ' + periodLabel(ctx.lane.period) + '\n' + ctx.item.name
      + (ctx.item.endKey ? '\n' + fmtShort(ctx.item.dueKey) + '〜' + fmtShort(ctx.item.endKey) : '')
      + '\n' + ctx.item.status;
    ev.onclick = function (e) { e.stopPropagation(); openDetail(e, ctx); };
    cell.appendChild(ev);
  });
  if (list.length > limit) {
    var more = el('div', 'ev-more', '＋' + (list.length - limit) + '件');
    more.onclick = function (e) { e.stopPropagation(); expandedCells[key] = true; renderView(); };
    cell.appendChild(more);
  }
  return cell;
}

// =====================================================================
// 詳細カード
// =====================================================================
function openDetail(ev, ctx) {
  if (!ctx) return;
  var box = document.getElementById('detail');
  box.innerHTML = '';
  box.className = 'open';

  var x = Math.min(ev.clientX + 12, window.innerWidth - 338);
  var y = Math.min(ev.clientY + 12, window.innerHeight - 260);
  box.style.left = Math.max(8, x) + 'px';
  box.style.top = Math.max(8, y) + 'px';

  var close = el('button', 'close-x', '×');
  close.onclick = closeDetail;
  box.appendChild(close);

  box.appendChild(el('h3', '', ctx.item.name));
  var r = ctx.item.remaining;
  var remainText = ctx.item.dueKey === DATA.today ? '本日'
    : r < 0 ? Math.abs(r) + '営業日超過' : 'あと' + r + '営業日';
  var whenText = ctx.item.endKey
    ? fmtLong(ctx.item.dueKey) + ' 〜 ' + fmtLong(ctx.item.endKey)
    : fmtLong(ctx.item.dueKey) + '　' + remainText;
  box.appendChild(el('div', 'sub',
    ctx.lane.workName + ' ' + periodLabel(ctx.lane.period) + '\n'
    + whenText
    + (ctx.item.owner ? '\n担当：' + ctx.item.owner : '')
    + '\n状態：' + ctx.item.status));

  if (ctx.item.note) box.appendChild(el('div', 'note', ctx.item.note));

  var actions = el('div', 'actions');
  DATA.statusList.forEach(function (s) {
    var b = el('button', s === '完了' ? 'primary' : '', s);
    if (s === ctx.item.status) b.disabled = true;
    b.onclick = function () { setStatus(ctx, s, b); };
    actions.appendChild(b);
  });
  box.appendChild(actions);
}

function closeDetail() {
  var b = document.getElementById('detail');
  b.className = '';
  b.style.display = '';
}

function setStatus(ctx, status, btn) {
  btn.disabled = true;
  btn.textContent = '更新中…';
  var before = ctx.item.status;
  google.script.run
    .withSuccessHandler(function () {
      closeDetail();
      // 全部を取り直すと数秒かかり、その間なにも変わらないので、
      // 手元のデータを書き換えてその場で描き直す（シートは更新済み）
      applyStatusLocally([ctx.item.key], status);
      renderAll();
    })
    .withFailureHandler(function (err) {
      ctx.item.status = before;
      btn.disabled = false;
      btn.textContent = status;
      notice('更新に失敗しました：' + err.message, true);
    })
    .updateItemStatus(ctx.item.key, status);
}

/**
 * 手元のデータに状態の変更を反映する。
 * 遅延の判定と、左パネル（期限超過／本日／まもなく）からの除外もここで行う。
 */
function applyStatusLocally(keys, status) {
  var set = {};
  keys.forEach(function (k) { set[k] = true; });
  var done = status === '完了' || status === '対象外';

  DATA.lanes.forEach(function (lane) {
    var changed = false;
    lane.items.forEach(function (it) {
      if (!set[it.key]) return;
      it.status = status;
      var deadline = it.endKey || it.dueKey;
      it.overdue = !done && deadline < DATA.today;
      changed = true;
    });
    if (changed) {
      lane.doneCount = lane.items.filter(function (i) { return i.status === '完了'; }).length;
    }
  });

  // 完了・対象外になった工程は通知の対象から外れる
  ['overdue', 'today', 'soon'].forEach(function (k) {
    DATA.digest[k] = (DATA.digest[k] || []).filter(function (i) {
      if (!set[i.key]) return true;
      return !done;
    }).map(function (i) {
      if (set[i.key]) i.status = status;
      return i;
    });
  });
  DATA.digest.total = DATA.digest.overdue.length + DATA.digest.today.length + DATA.digest.soon.length;
}

/** 回次まるごとの状態変更 */
function bulkStatus(lane, status, btn) {
  var items = laneItems(lane).filter(function (i) { return i.status !== status; });
  if (!items.length) { notice('変更が必要な工程はありません。'); return; }
  var label = lane.workName + '　' + periodLabel(lane.period);
  askConfirm({
    title: items.length + ' 工程を「' + status + '」にします',
    sub: label + '\nよろしいですか？',
    okLabel: status + 'にする',
    onOk: function () { runBulk(lane, status, btn, items); }
  });
}

function runBulk(lane, status, btn, items) {
  var keys = items.map(function (i) { return i.key; });
  var text = btn.textContent;
  btn.disabled = true;
  btn.textContent = '更新中…';
  google.script.run
    .withSuccessHandler(function () {
      applyStatusLocally(keys, status);
      renderAll();
      notice(keys.length + ' 工程を「' + status + '」にしました');
    })
    .withFailureHandler(function (err) {
      btn.disabled = false;
      btn.textContent = text;
      notice('更新に失敗しました：' + err.message, true);
    })
    .updateItemsStatus(keys, status);
}

/**
 * 小さなダイアログ。日付はカレンダーで選べるようにする。
 * @param {Object} o {title, sub, value, okLabel, onOk(value, setError)}
 */
/**
 * 確認ダイアログ。
 *
 * window.confirm はスプレッドシートのダイアログ（サンドボックス化された iframe）では
 * 「Ignored call to 'confirm()'」として無視され、常に false と同じ扱いになる。
 * 押しても何も起きない不具合になるため、画面内のダイアログで置き換えている。
 */
function askConfirm(o) {
  var back = el('div', 'dlg-back');
  back.id = 'confirmDialog';
  var box = el('div', 'dlg');
  box.setAttribute('role', 'dialog');
  box.setAttribute('aria-modal', 'true');
  box.onclick = function (ev) { ev.stopPropagation(); };

  box.appendChild(el('h3', '', o.title));
  if (o.sub) box.appendChild(el('div', 'sub', o.sub));

  var row = el('div', 'row');
  var cancel = el('button', '', o.cancelLabel || 'キャンセル');
  cancel.type = 'button';
  cancel.onclick = close;
  var ok = el('button', o.danger ? 'danger' : 'primary', o.okLabel || 'はい');
  ok.type = 'button';
  ok.onclick = function () { close(); o.onOk(); };
  row.appendChild(cancel);
  row.appendChild(ok);
  box.appendChild(row);

  back.appendChild(box);
  back.onclick = close;
  document.body.appendChild(back);
  ok.focus();

  function close() {
    if (back.parentNode) back.parentNode.removeChild(back);
    document.removeEventListener('keydown', onKey);
  }
  function onKey(ev) {
    if (ev.key === 'Escape') close();
    if (ev.key === 'Enter') ok.click();
  }
  document.addEventListener('keydown', onKey);
  return close;
}

/** 画面下に短く出す通知。alert もダイアログでは無視されるため、こちらを使う */
function notice(text, isError) {
  var old = document.getElementById('notice');
  if (old && old.parentNode) old.parentNode.removeChild(old);
  var t = el('div', 'notice' + (isError ? ' err' : ''), text);
  t.id = 'notice';
  t.setAttribute('role', isError ? 'alert' : 'status');
  document.body.appendChild(t);
  setTimeout(function () {
    if (t.parentNode) t.parentNode.removeChild(t);
  }, isError ? 7000 : 3500);
}

function openDateDialog(o) {
  var back = el('div', 'dlg-back');
  back.id = 'dateDialog';
  var box = el('div', 'dlg');
  box.setAttribute('role', 'dialog');
  box.setAttribute('aria-modal', 'true');
  box.onclick = function (ev) { ev.stopPropagation(); };

  box.appendChild(el('h3', '', o.title));
  if (o.sub) box.appendChild(el('div', 'sub', o.sub));

  var input = el('input');
  input.type = 'date';
  input.value = o.value || '';
  input.setAttribute('aria-label', o.title);
  box.appendChild(input);

  var err = el('div', 'err');
  err.hidden = true;
  err.setAttribute('role', 'alert');
  box.appendChild(err);

  function setError(msg) { err.textContent = msg; err.hidden = !msg; }

  var row = el('div', 'row');
  var cancel = el('button', '', 'キャンセル');
  cancel.type = 'button';
  cancel.onclick = close;
  var ok = el('button', 'primary', o.okLabel || '変更する');
  ok.type = 'button';
  ok.onclick = function () {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(input.value)) { setError('日付を選んでください。'); return; }
    o.onOk(input.value, setError, close, ok);
  };
  row.appendChild(cancel);
  row.appendChild(ok);
  box.appendChild(row);

  back.appendChild(box);
  back.onclick = close;
  document.body.appendChild(back);
  input.focus();

  function close() {
    if (back.parentNode) back.parentNode.removeChild(back);
    document.removeEventListener('keydown', onKey);
  }
  function onKey(ev) {
    if (ev.key === 'Escape') close();
    if (ev.key === 'Enter' && document.getElementById('dateDialog')) ok.click();
  }
  document.addEventListener('keydown', onKey);
  return close;
}

function changeAnchor(lane) {
  openDateDialog({
    title: lane.anchorName + 'を変更',
    sub: lane.workName + '　' + periodLabel(lane.period) + '\n'
      + 'この回次の工程がすべて計算し直されます。',
    value: lane.anchorKey,
    okLabel: '変更する',
    onOk: function (value, setError, close, btn) {
      btn.disabled = true;
      btn.textContent = '計算中…';
      google.script.run
        .withSuccessHandler(function () { close(); load(true); })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.textContent = '変更する';
          setError(err && err.message ? err.message : String(err));
        })
        .updateAnchorDate(lane.workId, lane.period, value);
    }
  });
}

// =====================================================================
// 印刷
//   ガントは、丸に重ねている工程名を吹き出しとして出した状態で刷る。
//   日付が近い工程どうしで吹き出しが重ならないよう、段を分けて配置する。
// =====================================================================
var printing = false;
var savedDayW = null;
var savedRange = null;   // 印刷のために横軸を切るので、戻せるように控える
var savedSc = null;      // 同じく表示サイズ

/** 紙のラベル列。画面より狭くして、そのぶん日付に幅を回す */
var PRINT_LABEL_W = 200;

/**
 * 紙に出す期間。
 *
 * 画面は［設定］の前月数・後月数ぶん出すが、そのまま刷ると工程の無い月まで
 * 場所を取り、1日あたりが潰れて目盛りも網掛けも読めなくなる。
 * 実際に工程がある範囲だけに切り、週の頭と週末で揃える。
 */
function printRange() {
  var min = null, max = null;
  visibleLanes().forEach(function (lane) {
    laneItems(lane).forEach(function (it) {
      var end = it.endKey || it.dueKey;
      if (min === null || it.dueKey < min) min = it.dueKey;
      if (max === null || end > max) max = end;
    });
  });
  if (min === null) return { from: DATA.from, to: DATA.to };

  // 今日の線が意味を持つよう、近ければ範囲に入れる。離れていれば伸ばさない
  var t = DATA.today;
  if (t < min && diffDays(t, min) <= 31) min = t;
  if (t > max && diffDays(max, t) <= 31) max = t;

  return { from: weekStart(addDays(min, -2)), to: weekEnd(addDays(max, 2)) };
}

/** A4横に収まる1日あたりの幅。狭い期間なら広げて紙を使い切る */
function printDayW() {
  var fit = Math.floor((PRINT_W - PRINT_LABEL_W) / Math.max(days.length, 1));
  return Math.max(3, Math.min(fit, 46));
}

/** 紙の先頭に付ける見出し */
function printHeader() {
  var head = el('div', 'print-head');
  var name = (DATA && DATA.title) || '業務スケジュール';
  var title = view === 'gantt' ? name + '（ガント）'
    : view === 'work' ? name + '（業務別）'
    : name + '（月間）';
  head.appendChild(el('div', 't', title));
  var meta = view === 'month'
    ? (+calMonth.slice(5, 7)) + '月　' + calMonth.slice(0, 4)
    : view === 'gantt' && days.length
      ? fmtLong(days[0]) + ' 〜 ' + fmtLong(days[days.length - 1])
      : fmtLong(DATA.from) + ' 〜 ' + fmtLong(DATA.to);
  head.appendChild(el('div', 'm', meta + '　／　出力日 ' + fmtLong(DATA.today)));
  return head;
}

/**
 * 吹き出しを段組みして重なりを避ける。
 * 左端をマーカーに合わせ、同じ段の直前の吹き出しと重なるなら1段上げる。
 */
function layoutLabels() {
  var grid = document.getElementById('grid');
  var floor = grid ? parseFloat(grid.style.getPropertyValue('--lane-h')) || 0 : 0;
  var laneEls = document.querySelectorAll('#grid .lane');
  Array.prototype.forEach.call(laneEls, function (laneEl) {
    var track = laneEl.querySelector('.track');
    if (!track) return;
    var labels = Array.prototype.slice.call(track.querySelectorAll('.plabel'));
    if (!labels.length) return;

    var trackW = track.offsetWidth;
    var boxes = labels.map(function (lab) {
      var x = Number(lab.dataset.x);
      var w = lab.offsetWidth;
      return { el: lab, left: Math.max(0, Math.min(x, trackW - w)), w: w, x: x };
    }).sort(function (a, b) { return a.left - b.left; });

    var levelEnd = [];
    var maxLevel = 0;
    boxes.forEach(function (b) {
      var level = 0;
      while (levelEnd[level] !== undefined && levelEnd[level] + 3 > b.left) level++;
      levelEnd[level] = b.left + b.w;
      b.level = level;
      if (level > maxLevel) maxLevel = level;
    });

    // 段の間隔は吹き出しの実際の高さから決める。
    // 決め打ちにすると、文字サイズや行間の違いでわずかに接触してしまう。
    var lineH = Math.max(12, (boxes[0].el.offsetHeight || 12) + 3);
    var baseBottom = 16;                     // マーカーの上に空ける高さ
    // 画面では、余白を埋めるために広げた高さより低くはしない
    var needed = baseBottom + (maxLevel + 1) * lineH + 6;
    laneEl.style.minHeight = Math.max(needed, floor) + 'px';

    boxes.forEach(function (b) {
      b.el.style.left = b.left + 'px';
      b.el.style.bottom = (baseBottom + b.level * lineH) + 'px';
      // 吹き出しからマーカーへ細い線を引く
      var leader = el('div', 'pleader');
      leader.style.left = b.x + 'px';
      leader.style.bottom = '10px';
      leader.style.height = (baseBottom + b.level * lineH - 10) + 'px';
      track.appendChild(leader);
    });
  });
}

/**
 * 紙のページごとに切り分け、各ページの先頭に日付軸を付ける。
 *
 * 1つの塊のまま流すと、2ページ目から日付が無く読めない。
 * 高さは .printing を付けたあとに測る（紙と同じ寸法になっている）。
 */
function paginateForPrint(chromeH) {
  var grid = document.getElementById('grid');
  var head = grid.querySelector('.head');
  var bg = grid.querySelector('.bg-layer');
  var lanes = Array.prototype.slice.call(grid.querySelectorAll('.lane'));
  if (!head || !lanes.length) return 1;

  var headH = head.offsetHeight;
  var pages = [], cur = [], used = 0, first = true;
  lanes.forEach(function (lane) {
    var h = lane.offsetHeight;
    var cap = (first ? PRINT_H - chromeH : PRINT_H) - headH - 4;
    if (cur.length && used + h > cap) {
      pages.push(cur);
      cur = []; used = 0; first = false;
    }
    cur.push(lane);
    used += h;
  });
  if (cur.length) pages.push(cur);

  grid.innerHTML = '';
  pages.forEach(function (list, i) {
    var pg = el('div', 'gpage' + (i < pages.length - 1 ? ' brk' : ''));
    if (bg) pg.appendChild(bg.cloneNode(true));
    pg.appendChild(i === 0 ? head : head.cloneNode(true));
    list.forEach(function (lane) { pg.appendChild(lane); });
    grid.appendChild(pg);
  });
  return pages.length;
}

/** 見出しと凡例が占める高さ。1ページ目に何行入るかの計算に使う */
function printChromeH() {
  var h = 0;
  ['.print-head', '.legend'].forEach(function (sel) {
    var e = document.querySelector(sel);
    if (e) h += e.offsetHeight + 6;
  });
  return h;
}

/** カレンダーを1ページに収める。行が高さを分け合うので、枠の高さだけ決めればよい */
function fitCalendarToPage(chromeH) {
  var wrap = document.querySelector('.cal-wrap');
  if (!wrap) return;
  // 端数で1行あふれると2ページ目に1行だけ出て台無しになるので、少し余らせる
  wrap.style.height = Math.max(240, PRINT_H - chromeH - 10) + 'px';
}

function startPrint() {
  printing = true;
  document.body.classList.add('printing');
  // 紙は幅が決まっているので、画面の表示サイズは持ち込まない。
  // 先に当てておかないと、1ページに何行入るかを測れない
  savedSc = document.documentElement.style.getPropertyValue('--sc');
  document.documentElement.style.setProperty('--sc', '1');
  // 幅も紙に合わせる。画面幅のままだと凡例の段数や業務名の折り返しが変わり、
  // 1ページに入る行数の見積もりがずれる
  document.body.style.width = PRINT_W + 'px';

  // 見出しに刷る期間を書くので、横軸を切り直してから作る
  if (view === 'gantt') {
    savedDayW = dayW;
    savedRange = { from: days[0], to: days[days.length - 1] };
    var r = printRange();
    buildDays(r.from, r.to);
    dayW = printDayW();
    document.documentElement.style.setProperty('--label-w', PRINT_LABEL_W + 'px');
    // 印刷時はマーカーを行の下に寄せ、上に吹き出しを積む（drawGantt の中で配置する）
    drawGantt(document.getElementById('grid'));
  }

  var content = document.getElementById('content');
  var view0 = content.querySelector('.view');
  if (view0 && !view0.querySelector('.print-head')) {
    view0.insertBefore(printHeader(), view0.firstChild);
  }

  // 見出しと凡例の高さが決まってから、ページ割りと高さ合わせをする
  var chrome = printChromeH();
  if (view === 'gantt') paginateForPrint(chrome);
  if (view === 'month') fitCalendarToPage(chrome);

  window.print();
}

function endPrint() {
  if (!printing) return;
  printing = false;
  document.body.classList.remove('printing');
  if (savedDayW !== null) { dayW = savedDayW; savedDayW = null; }
  if (savedRange) { buildDays(savedRange.from, savedRange.to); savedRange = null; }
  document.documentElement.style.removeProperty('--label-w');
  if (savedSc) document.documentElement.style.setProperty('--sc', savedSc);
  else document.documentElement.style.removeProperty('--sc');
  savedSc = null;
  document.body.style.removeProperty('width');
  renderView();
}

window.addEventListener('afterprint', endPrint);

// =====================================================================
// 操作
// =====================================================================
document.getElementById('tabs').onclick = function (ev) {
  var b = ev.target.closest('button');
  if (!b || !b.dataset.view) return;
  view = b.dataset.view;
  Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) { x.classList.remove('on'); });
  b.classList.add('on');
  movePill();
  closeDetail();
  syncLabelBtn();
  if (DATA) renderView();
};

/** ［工程名］はガントだけの操作なので、他のビューでは隠す */
function syncLabelBtn() {
  document.getElementById('btnLabels').hidden = view !== 'gantt';
}

/**
 * ［小］［中］［大］を反映する。
 * 1日の幅だけでなく、文字の倍率（--sc）と行の高さもまとめて動かす。
 * 文字サイズは --fs-* に寄せてあるので、--sc を変えれば画面全体が同じ比で変わる。
 */
function applySize(b, rerender) {
  if (!b) return;
  dayW = Number(b.getAttribute('data-w')) || 30;
  laneH = Number(b.getAttribute('data-h')) || 62;
  document.documentElement.style.setProperty('--sc', b.getAttribute('data-sc') || '1');
  var zoom = document.getElementById('zoom');
  Array.prototype.forEach.call(zoom.querySelectorAll('button'), function (x) { x.classList.remove('on'); });
  b.classList.add('on');
  try { localStorage.setItem(SIZE_KEY, b.textContent); } catch (e) { /* 保存できなくても動作に影響はない */ }
  if (rerender && DATA) { renderView(); setTimeout(scrollToToday, 40); }
}

/** 前回選んだ表示サイズを復元する（未保存なら［中］のまま） */
function loadSize() {
  var saved = null;
  try { saved = localStorage.getItem(SIZE_KEY); } catch (e) { /* 読めなくてもよい */ }
  var zoom = document.getElementById('zoom');
  var btn = null;
  Array.prototype.forEach.call(zoom.querySelectorAll('button'), function (x) {
    if (saved && x.textContent === saved) btn = x;
  });
  applySize(btn || zoom.querySelector('.on'), false);

  var lab = null;
  try { lab = localStorage.getItem(LABELS_KEY); } catch (e) { /* 読めなくてもよい */ }
  applyLabels(lab === 'on', false);
}

document.getElementById('zoom').onclick = function (ev) {
  applySize(ev.target.closest('button'), true);
};

/** ガントに工程名を出すかを切り替える */
function applyLabels(on, rerender) {
  labelsOn = !!on;
  var b = document.getElementById('btnLabels');
  b.classList.toggle('on', labelsOn);
  b.setAttribute('aria-pressed', labelsOn ? 'true' : 'false');
  try { localStorage.setItem(LABELS_KEY, labelsOn ? 'on' : 'off'); } catch (e) { /* 保存できなくてもよい */ }
  if (rerender && DATA && view === 'gantt') {
    drawGantt(document.getElementById('grid'));
    setTimeout(scrollToToday, 40);
  }
}

document.getElementById('btnLabels').onclick = function () { applyLabels(!labelsOn, true); };

document.getElementById('btnPrint').onclick = startPrint;

// 検索と担当の絞り込み
var qTimer = null;
document.getElementById('q').addEventListener('input', function () {
  var v = this.value;
  document.getElementById('qClear').hidden = !v;
  // 打つたびに全部組み直すと重いので、少しだけ待つ
  clearTimeout(qTimer);
  qTimer = setTimeout(function () {
    query = v.trim().toLowerCase();
    if (DATA) renderAll();
  }, 180);
});
document.getElementById('qClear').onclick = clearFilter;
document.getElementById('ownerSel').onchange = function () {
  ownerFilter = this.value;
  if (DATA) renderAll();
};
document.getElementById('btnReload').onclick = function () { load(); };
document.getElementById('btnToday').onclick = scrollToToday;

document.getElementById('btnTheme').onclick = function (ev) {
  ev.stopPropagation();
  document.getElementById('themePop').classList.toggle('open');
};
document.addEventListener('click', function (ev) {
  if (!ev.target.closest('.theme-wrap')) document.getElementById('themePop').classList.remove('open');
  if (!ev.target.closest('#detail') && !ev.target.closest('.mark') && !ev.target.closest('.ev') && !ev.target.closest('.row-item') && !ev.target.closest('.card')) {
    closeDetail();
  }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') { closeDetail(); document.getElementById('themePop').classList.remove('open'); }
});
var resizeTimer = null;
window.addEventListener('resize', function () {
  movePill();
  // 高さが変わると1セルに入る件数が変わるため、月間ビューは組み直す
  if (view !== 'month' || !DATA) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderView, 200);
});

loadTheme();
applyTheme(themeId, false);
loadSize();
movePill();
load();
</script>
