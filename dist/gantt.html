<!-- version: 2.2.0 -->
<!-- スケジュール画面：ガント（業務横断）／業務別／月間カレンダー の3ビュー -->
<style>
  /* ============ テーマ変数（既定はライト。JS で上書きする） ============ */
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f8f9fa;
    --surface-3: #f1f3f4;
    --text: #202124;
    --muted: #5f6368;
    --border: #e3e6ea;
    --accent: #1a73e8;
    --accent-soft: #e8f0fe;
    --danger: #d93025;
    --danger-soft: #fce8e6;
    --warn: #e37400;
    --warn-soft: #fef7e0;
    --shadow: 0 6px 24px rgba(0,0,0,.14);
    --label-w: 260px;
    --radius: 10px;
    --dur: .28s;
    --ease: cubic-bezier(.4, 0, .2, 1);

    /* ============ 表示サイズ ============
       ヘッダーの［小］［中］［大］が --sc（文字の倍率）と1日の幅をまとめて変える。
       文字サイズは下の4段階に寄せてあるので、--sc を変えれば全体が同じ比で動く。 */
    --sc: 1.14;
    --fs-xs: calc(11px * var(--sc));    /* 目盛り・注釈 */
    --fs-sm: calc(12px * var(--sc));    /* メタ情報 */
    --fs-md: calc(13.5px * var(--sc));  /* 本文 */
    --fs-lg: calc(15.5px * var(--sc));  /* 見出し */
    /* ガント1行の高さ。画面に余白があるときは JS がこれ以上に広げる */
    --lane-h: 60px;
    --head-h: calc(23px * var(--sc));
  }

  * { box-sizing: border-box; }
  /* display を指定した要素でも hidden 属性が効くようにする */
  [hidden] { display: none !important; }

  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Noto Sans JP", "Yu Gothic", "Hiragino Sans", system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    font-size: var(--fs-md);
    -webkit-font-smoothing: antialiased;
  }
  body, header.top, aside, .surface, .lane-label, .head, .head-label,
  .chip, #detail, .cell, .kase, .row-item, button, select, input {
    transition: background-color .4s var(--ease), color .4s var(--ease),
                border-color .4s var(--ease), box-shadow .25s var(--ease);
  }

  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ============ ヘッダー ============ */
  header.top {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 16px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex: 0 0 auto; position: relative; z-index: 20;
  }
  header.top h1 { font-size: 15.5px; margin: 0; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
  .today-badge {
    font-size: 12.5px; color: var(--muted); white-space: nowrap;
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 4px 11px; border-radius: 999px;
  }
  .spacer { flex: 1; }

  button {
    font-family: inherit; font-size: 13px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 6px 12px; border-radius: 7px;
  }
  button:hover { background: var(--surface-2); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .45; cursor: default; transform: none; }
  /* 押している状態を保つボタン（工程名の表示など） */
  button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }

  /* ビュー切替タブ */
  .tabs { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 2px; position: relative; }
  .tabs button {
    border: none; background: none; border-radius: 7px; padding: 5px 14px;
    color: var(--muted); font-weight: 600; position: relative; z-index: 1;
  }
  .tabs button:hover { background: none; transform: none; color: var(--text); }
  .tabs button.on { color: var(--accent); }
  .tab-pill {
    position: absolute; top: 2px; bottom: 2px; border-radius: 7px;
    background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12);
    transition: left .32s var(--ease), width .32s var(--ease);
    z-index: 0;
  }

  .applink {
    font-size: 13px; color: var(--accent); text-decoration: none; white-space: nowrap;
    border: 1px solid var(--border); border-radius: 7px; padding: 6px 12px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .applink:hover { background: var(--surface-2); }
  .zoom { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .zoom button { border: none; border-radius: 0; border-left: 1px solid var(--border); }
  .zoom button:first-child { border-left: none; }
  .zoom button.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }

  /* テーマ選択 */
  .theme-wrap { position: relative; }
  .theme-pop {
    position: absolute; right: 0; top: calc(100% + 8px);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 10px; width: 268px; z-index: 30;
    display: none;
  }
  .theme-pop.open { display: block; animation: popIn .22s var(--ease); }
  .theme-pop .t-title { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
  .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
  .theme-card {
    border: 1.5px solid var(--border); border-radius: 9px; padding: 7px 8px;
    cursor: pointer; background: var(--surface); text-align: left;
  }
  .theme-card:hover { transform: translateY(-1px); }
  .theme-card.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .theme-name { font-size: 11px; font-weight: 600; margin-bottom: 5px; }
  .theme-swatches { display: flex; gap: 3px; }
  .theme-swatches i { width: 100%; height: 11px; border-radius: 3px; display: block; }

  /* ============ 本体レイアウト ============ */
  .main { display: flex; flex: 1; min-height: 0; }
  aside {
    width: 296px; flex: 0 0 296px; border-right: 1px solid var(--border);
    overflow-y: auto; padding: 12px; background: var(--surface-2);
  }
  .content { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  .view { flex: 1; display: flex; flex-direction: column; min-height: 0; animation: viewIn var(--dur) var(--ease); }

  /* ============ 左パネル ============ */
  .group-title {
    font-size: var(--fs-xs); font-weight: 700; letter-spacing: .06em;
    display: flex; align-items: center; gap: 6px; margin: 15px 0 7px;
  }
  .group-title:first-child { margin-top: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: 0 0 8px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 10px; margin-bottom: 6px; cursor: pointer;
    animation: slideIn .3s var(--ease) backwards;
  }
  .card:hover { border-color: var(--accent); transform: translateX(2px); }
  .card .name { font-weight: 600; line-height: 1.35; }
  .card .meta { color: var(--muted); font-size: var(--fs-sm); margin-top: 3px; line-height: 1.45; white-space: pre-line; }
  .card.overdue { border-left: 3px solid var(--danger); }
  .card.today { border-left: 3px solid var(--warn); }
  .card.soon { border-left: 3px solid var(--accent); }
  .empty { color: var(--muted); font-size: var(--fs-md); padding: 10px 2px; line-height: 1.6; }

  /* ============ 凡例 ============ */
  .legend { display: flex; flex-wrap: wrap; gap: 6px; padding: 9px 13px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 11px; font-size: var(--fs-sm); cursor: pointer; user-select: none;
    background: var(--surface); color: var(--text);
  }
  .chip:hover { transform: translateY(-1px); }
  .chip.off { opacity: .35; }
  .chip.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  /* ============ ガント ============ */
  .scroll { flex: 1; overflow: auto; position: relative; background: var(--surface); }
  .grid { position: relative; }
  .bg-layer { position: absolute; top: 0; bottom: 0; pointer-events: none; }
  .bg-cell { position: absolute; top: 0; bottom: 0; background: var(--surface-3); }
  /* 紙用の罫線。日 → 週 → 月 の順に濃くして、区切りが分かるようにする */
  .vline { position: absolute; top: 0; bottom: 0; width: 1px; background: #d9dce1; opacity: .5; }
  .vline.week { opacity: .9; }
  .vline.month { background: #9aa0a6; opacity: 1; }
  .today-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); opacity: .7; }
  .today-line::before {
    content: ''; position: absolute; top: 0; left: -3px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--danger); animation: pulse 2.4s ease-in-out infinite;
  }

  .head { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
  .head-row { display: flex; height: var(--head-h); }
  .head-label {
    position: sticky; left: 0; z-index: 6; background: var(--surface);
    width: var(--label-w); flex: 0 0 var(--label-w); border-right: 1px solid var(--border);
    /* flex の min-width:auto で中身のぶんだけ広がると、
       絶対配置の網掛け（.bg-layer）と目盛りがずれる */
    min-width: 0;
  }
  .month-cell {
    font-size: var(--fs-sm); font-weight: 700; color: var(--muted);
    border-left: 1px solid var(--border); padding-left: 7px;
    display: flex; align-items: center; white-space: nowrap; overflow: hidden;
    min-width: 0;
  }
  /* マスは背景だけ。min-width を許すと中身のぶん広がって網掛けとずれる */
  .day { flex: 0 0 auto; min-width: 0; }
  /* 日付の文字はマスの上に重ねる。隣のマスの背景に欠けない */
  .tick-layer { position: absolute; top: var(--head-h); height: var(--head-h); pointer-events: none; }
  .tick {
    position: absolute; top: 0; transform: translateX(-50%);
    font-size: var(--fs-xs); line-height: var(--head-h); color: var(--muted); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .tick.today { color: var(--danger); font-weight: 700; }
  .day.we { background: var(--surface-3); }
  .day.today { background: var(--danger-soft); }

  .lane { display: flex; border-bottom: 1px solid var(--border); min-height: var(--lane-h); }
  .lane:hover { background: var(--surface-2); }
  .lane-label {
    position: sticky; left: 0; z-index: 3; background: var(--surface);
    width: var(--label-w); flex: 0 0 var(--label-w); border-right: 1px solid var(--border);
    padding: 6px 10px; display: flex; flex-direction: column; justify-content: center; gap: 3px;
    /* 業務名が長くても列幅を押し広げない（押し広げると、その行だけ目盛りとずれる） */
    min-width: 0; overflow: hidden;
  }
  .lane:hover .lane-label { background: var(--surface-2); }
  .lane-title {
    font-weight: 600; font-size: var(--fs-md); display: flex; align-items: center; gap: 6px;
    line-height: 1.3; min-width: 0; overflow-wrap: anywhere;
  }
  .lane-title.repeat { opacity: .42; font-weight: 500; }
  .lane-sub .period { font-weight: 700; color: var(--text); }
  .lane-sub { font-size: var(--fs-xs); color: var(--muted); display: flex; align-items: center; gap: 9px; }
  .lane-sub a { color: var(--accent); text-decoration: none; cursor: pointer; }
  .lane-sub a:hover { text-decoration: underline; }
  .swatch { width: 3px; height: 15px; border-radius: 2px; flex: 0 0 3px; }

  .track { position: relative; flex: 1 0 auto; }
  .span {
    position: absolute; height: 8px; top: 50%; margin-top: -4px; border-radius: 4px;
    transform-origin: left center; animation: growX .5s var(--ease) backwards;
  }
  /* 工程名を吹き出しで出すときは、マーカーを行の下端に寄せて上に積む。
     印刷（.printing）と画面（.labels）で同じ配置を使う。
     .lane に align-items:flex-end を掛けると業務名の列まで縮んで背景が欠け、
     裏の土日の網掛けが透けるので、伸ばしたまま中身の位置だけを変える。 */
  body.printing .mark, body.printing .range, body.printing .span,
  body.labels .mark, body.labels .range, body.labels .span {
    top: auto !important; bottom: 5px; margin-top: 0 !important;
  }
  /* align-self:flex-end にするとラベルが行の高さぶん伸びなくなり、
     背景が欠けて裏の土日の網掛けが業務名の列に透けて見える。
     枠は行いっぱいに保ったまま、中身だけを下に寄せる。 */
  body.printing .lane-label, body.labels .lane-label { justify-content: flex-end; padding-bottom: 4px; }
  .mark {
    position: absolute; top: 50%; width: 13px; height: 13px; margin-top: -6.5px;
    border-radius: 50%; border: 2px solid var(--surface); cursor: pointer;
    box-shadow: 0 0 0 1px rgba(0,0,0,.12);
    transition: transform .18s var(--ease), box-shadow .18s var(--ease);
    animation: popIn .34s var(--ease) backwards;
  }
  .mark:hover { transform: scale(1.45); z-index: 4; }
  .mark.done { background: var(--surface) !important; box-shadow: 0 0 0 1.5px var(--muted); }
  .mark.overdue { box-shadow: 0 0 0 2px var(--danger); }
  .mark.anchor { width: 15px; height: 15px; margin-top: -7.5px; border-radius: 3px; transform: rotate(45deg); }
  .mark.anchor:hover { transform: rotate(45deg) scale(1.35); }

  /* 「この日からこの日まで」の工程 */
  .range {
    position: absolute; height: 11px; top: 50%; margin-top: -5.5px;
    border-radius: 6px; opacity: .55; cursor: pointer;
    transform-origin: left center; animation: growX .5s var(--ease) backwards;
  }
  .range:hover { opacity: .8; }
  .range.done { opacity: .25; }
  .range.overdue { box-shadow: 0 0 0 1.5px var(--danger); }

  /* ============ 業務別ビュー ============ */
  .work-scroll { flex: 1; overflow-y: auto; padding: 14px 16px 40px; }
  .kase {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    margin-bottom: 14px; overflow: hidden; animation: slideIn .34s var(--ease) backwards;
  }
  .kase-head {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px;
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .kase-period { font-weight: 700; font-size: var(--fs-lg); }
  .kase-anchor { font-size: var(--fs-sm); color: var(--muted); }
  .kase-anchor a { color: var(--accent); text-decoration: none; cursor: pointer; }
  .kase-anchor a:hover { text-decoration: underline; }
  .progress { flex: 1; min-width: 120px; max-width: 320px; height: 6px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
  .progress i { display: block; height: 100%; border-radius: 999px; transition: width .6s var(--ease); }
  .kase-count { font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; }

  .steps { padding: 6px 14px 12px; }
  .row-item {
    display: flex; align-items: center; gap: 11px; padding: 7px 8px 7px 4px;
    border-radius: 8px; cursor: pointer; position: relative;
    animation: slideIn .3s var(--ease) backwards;
  }
  .row-item:hover { background: var(--surface-2); }
  .rail { position: relative; width: 16px; flex: 0 0 16px; align-self: stretch; display: flex; justify-content: center; }
  .rail::before {
    content: ''; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--border);
  }
  .row-item:first-child .rail::before { top: 50%; }
  .row-item:last-child .rail::before { bottom: 50%; }
  .rail i {
    position: relative; align-self: center; width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid var(--surface); box-shadow: 0 0 0 1px rgba(0,0,0,.12);
  }
  .row-date {
    font-size: var(--fs-sm); font-variant-numeric: tabular-nums; width: 76px; flex: 0 0 76px;
    color: var(--muted); font-weight: 600;
  }
  .row-date.wide { width: 148px; flex: 0 0 148px; }
  .row-name { flex: 1; font-size: var(--fs-md); line-height: 1.4; min-width: 0; }
  .row-owner { font-size: var(--fs-sm); color: var(--muted); }
  .pill {
    font-size: var(--fs-xs); padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
  }
  .pill.done { background: var(--surface-3); }
  .pill.overdue { background: var(--danger-soft); color: var(--danger); border-color: transparent; font-weight: 700; }
  .pill.today { background: var(--warn-soft); color: var(--warn); border-color: transparent; font-weight: 700; }
  .row-item.done .row-name { color: var(--muted); }
  .row-item.done .row-label { text-decoration: line-through; text-decoration-thickness: 1px; }
  .row-item.today { background: var(--warn-soft); }

  /* ============ 月間カレンダー ============ */
  .cal-bar {
    display: flex; align-items: center; gap: 10px; padding: 9px 14px;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .chip { white-space: nowrap; }
  .cal-title { font-size: var(--fs-lg); font-weight: 700; min-width: 132px; }
  /* 月グリッドは縦スクロールさせず、画面の高さに合わせて行を分け合う */
  .cal-wrap {
    flex: 1; min-height: 0; overflow: hidden;
    padding: 10px 14px 12px; display: flex; flex-direction: column;
  }
  .cal-head { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
  .cal-head div { text-align: center; font-size: var(--fs-sm); font-weight: 700; color: var(--muted); padding: 3px 0; }
  .cal-head div.sun { color: #d93025; }
  .cal-head div.sat { color: #1a73e8; }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    flex: 1; min-height: 0; grid-auto-rows: minmax(0, 1fr);
  }
  .cell {
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    padding: 5px 6px; min-height: 0; display: flex; flex-direction: column; gap: 3px;
    animation: cellIn .3s var(--ease) backwards; overflow-y: auto; overflow-x: hidden;
  }
  .cell::-webkit-scrollbar { width: 5px; }
  .cell::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .cell-head { position: sticky; top: -5px; background: inherit; padding-top: 1px; }

  /* 画面が低いときは余白と文字を詰めて、1か月ぶんを収める */
  @media (max-height: 780px) {
    .cal-wrap { padding: 6px 10px 8px; }
    .cal-grid, .cal-head { gap: 4px; }
    .cell { padding: 3px 5px; border-radius: 7px; }
    .cell-num { font-size: var(--fs-sm); }
    .ev { font-size: var(--fs-xs); padding: 2px 5px; }
    .legend { padding: 6px 10px; }
    .cal-bar { padding: 6px 10px; }
    header.top { padding: 6px 12px; }
  }
  @media (max-height: 640px) {
    .cal-head div { font-size: var(--fs-xs); padding: 1px 0; }
    .ev { font-size: var(--fs-xs); line-height: 1.25; }
    .cell-hol { display: none; }
  }
  .cell.out { opacity: .4; }
  .cell.we { background: var(--surface-2); }
  .cell.today { border-color: var(--danger); box-shadow: 0 0 0 2px var(--danger-soft); }
  .cell-head { display: flex; align-items: baseline; gap: 5px; }
  .cell-num { font-size: var(--fs-md); font-weight: 700; font-variant-numeric: tabular-nums; }
  .cell.today .cell-num { color: var(--danger); }
  .cell-hol { font-size: var(--fs-xs); color: var(--danger); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev {
    display: flex; align-items: center; gap: 5px; font-size: var(--fs-xs); line-height: 1.35;
    padding: 3px 6px; border-radius: 5px; cursor: pointer;
    animation: popIn .26s var(--ease) backwards; overflow: hidden;
  }
  .ev span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .ev:hover { filter: brightness(.96); transform: translateX(2px); }
  .ev i { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 6px; }
  .ev.done { opacity: .5; text-decoration: line-through; }
  .ev.overdue { box-shadow: inset 0 0 0 1.5px var(--danger); }
  .ev-more { font-size: var(--fs-xs); color: var(--muted); cursor: pointer; padding: 1px 6px; }
  .ev-more:hover { color: var(--accent); }

  /* ============ 詳細カード ============ */
  #detail {
    position: fixed; z-index: 40; width: 322px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); padding: 15px; display: none;
  }
  #detail.open { display: block; animation: popIn .22s var(--ease); }
  #detail h3 { margin: 0 22px 5px 0; font-size: var(--fs-lg); line-height: 1.35; }
  #detail .sub { color: var(--muted); font-size: var(--fs-sm); margin-bottom: 10px; line-height: 1.6; white-space: pre-line; }
  #detail .actions { display: flex; gap: 6px; margin-top: 11px; flex-wrap: wrap; }
  #detail .note {
    background: var(--surface-2); border-radius: 7px; padding: 8px 10px;
    font-size: var(--fs-sm); color: var(--muted); line-height: 1.55; margin-top: 8px;
  }
  .close-x {
    position: absolute; top: 8px; right: 8px; border: none; background: none;
    font-size: 17px; color: var(--muted); padding: 2px 7px; line-height: 1;
  }
  .close-x:hover { background: var(--surface-2); }

  #loading, .msg-box { padding: 44px; text-align: center; color: var(--muted); }
  .msg-box.error { color: var(--danger); white-space: pre-wrap; text-align: left; }
  .spinner {
    width: 22px; height: 22px; border: 2.5px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; margin: 0 auto 12px; animation: spin .8s linear infinite;
  }

  /* 検索と担当の絞り込み */
  .finder { position: relative; display: inline-flex; align-items: center; }
  .finder .find-i {
    position: absolute; left: 8px; width: 14px; height: 14px; stroke: var(--muted);
    fill: none; stroke-width: 2; pointer-events: none;
  }
  .finder input {
    width: 160px; padding: 6px 24px 6px 27px; font-size: 13px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text);
  }
  .finder input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .finder input::-webkit-search-cancel-button { display: none; }
  .q-x {
    position: absolute; right: 4px; border: none; background: none; color: var(--muted);
    font-size: 15px; line-height: 1; padding: 2px 5px; border-radius: 50%; cursor: pointer;
  }
  .q-x:hover { background: var(--surface-2); color: var(--text); }
  #ownerSel { max-width: 140px; }
  .filter-note {
    font-size: var(--fs-sm); color: var(--muted); padding: 7px 12px; border-bottom: 1px solid var(--border);
    background: var(--surface-2); display: flex; align-items: center; gap: 10px;
  }
  .filter-note b { color: var(--text); }

  /* 回次まるごとの操作 */
  .kase-bulk { margin-left: auto; display: flex; gap: 6px; }
  .kase-bulk button { font-size: var(--fs-sm); padding: 4px 9px; }

  /* 基準日の入力 */
  .dlg-back {
    position: fixed; inset: 0; background: rgba(15, 23, 42, .28); z-index: 60;
    display: flex; align-items: center; justify-content: center;
  }
  .dlg {
    background: var(--surface); border-radius: 12px; padding: 16px 18px; min-width: 290px;
    box-shadow: 0 18px 48px rgba(0, 0, 0, .22); animation: popIn .18s var(--ease);
  }
  .dlg h3 { margin: 0 0 4px; font-size: var(--fs-lg); }
  .dlg .sub { font-size: var(--fs-sm); color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
  .dlg input[type=date] {
    width: 100%; padding: 7px 9px; font-size: var(--fs-md); font-family: inherit;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text);
  }
  .dlg .row { display: flex; gap: 7px; justify-content: flex-end; margin-top: 14px; }
  .dlg .err { color: var(--danger); font-size: var(--fs-sm); margin-top: 7px; }
  .dlg button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }

  /* 画面内の通知（alert の代わり） */
  .notice {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 60; max-width: 640px;
    background: var(--text); color: var(--bg);
    font-size: var(--fs-sm); line-height: 1.5;
    padding: 10px 16px; border-radius: 8px; box-shadow: var(--shadow);
    animation: slideIn .22s var(--ease);
  }
  .notice.err { background: var(--danger); color: #fff; }

  /* ============ 印刷 ============ */
  /* 画面では出さず、紙にだけ出す見出し */
  .print-head { display: none; }

  .plabel {
    position: absolute; font-size: calc(10.5px * var(--sc)); line-height: 1.3; white-space: nowrap;
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 4px; color: var(--text); pointer-events: none;
    /* 引き出し線より必ず上に描く。下にすると線が吹き出しを突き抜けて見える */
    z-index: 2;
  }
  .plabel .pdate {
    font-weight: 700; font-variant-numeric: tabular-nums; margin-right: 4px;
    color: var(--muted);
  }
  .pleader { position: absolute; width: 1px; background: var(--border); pointer-events: none; z-index: 1; }
  /* 紙の寸法は、印刷を始めた時点で測れないと1ページに何行入るか決められない。
     @media print だけに書くと window.print() の後にしか効かないため、
     .printing を付けた時点で同じ大きさになるようにしておく */
  body.printing .plabel { font-size: 8.5px; }
  /* ガントは紙のページごとに切り分け、各ページの先頭に日付軸を付ける */
  .gpage { position: relative; }

  @page { size: A4 landscape; margin: 8mm; }

  /* ============ 印刷 ============
     紙のレイアウトは .printing を付けた時点で当てる。
     @media print だけに書くと window.print() のあとにしか効かず、
     「1ページに何行入るか」「凡例が何段になるか」を JS が測れない。
     （幅も startPrint が紙の幅に合わせる） */
  body.printing { background: #fff; height: auto; }
  body.printing #app { height: auto; display: block; }
  body.printing .main { display: block; }
  body.printing .content { overflow: visible; }

  /* 操作部と「今日やること」は紙には要らない */
  body.printing header.top, body.printing aside, body.printing #detail,
  body.printing .theme-pop, body.printing .insert, body.printing .kase-bulk,
  body.printing .dlg-back { display: none !important; }
  /* 月の切り替えは紙では意味がない。月は見出しに出ている */
  body.printing .cal-bar { display: none !important; }

  body.printing .view { animation: none; display: block; }
  body.printing .scroll, body.printing .work-scroll { overflow: visible !important; height: auto !important; }
  /* カレンダーの高さは、1ページに収まるよう JS が紙に合わせて入れる */
  body.printing .cal-wrap { overflow: hidden !important; }
  body.printing .cell { overflow: hidden !important; }
  /* .grid の幅は印刷用に計算した値（ラベル列＋日数×1日の幅）。
     auto にすると track だけが伸びて、絶対配置の網掛けとずれる */
  body.printing .track { flex: 0 0 auto !important; }
  /* sticky は解くが、土日の網掛けより上に描くため位置指定は残す
     （static にすると背景レイヤーが上に来て、月名が読めなくなる） */
  body.printing .head, body.printing .head-label,
  body.printing .lane-label { position: relative !important; }

  /* 休みの網掛けは、罫線が読める程度まで薄くする。
     テーマによっては色が強く、刷ると網掛けだけが目立ってしまう */
  body.printing .bg-cell, body.printing .day.we { background: #f2f3f5 !important; }
  body.printing .day.today { background: #fde8e8 !important; }
  body.printing .month-cell { border-left: none; }

  body.printing .print-head {
    display: block; margin: 0 0 8px; padding: 0 2px 6px;
    border-bottom: 1.5px solid var(--text);
  }
  body.printing .print-head .t { font-size: 14px; font-weight: 700; }
  body.printing .print-head .m { font-size: 10px; color: var(--muted); margin-top: 2px; }

  body.printing .mark, body.printing .range, body.printing .span,
  body.printing .card, body.printing .kase,
  body.printing .row-item, body.printing .step { animation: none !important; }

  @media print {
    /* 背景色を紙にも出す（工程の色分けが意味を持つため） */
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    /* JS がインラインで指定するので、紙側は !important で押し戻す */
    :root { --sc: 1 !important; --lane-h: 46px !important; }
    .legend .chip { pointer-events: none; }

    /* ページ割りは JS が .gpage に分けている。ここで実際に改ページする */
    .gpage.brk { break-after: page; page-break-after: always; }
    .lane { break-inside: avoid; page-break-inside: avoid; }
    .kase { break-inside: avoid; page-break-inside: avoid; box-shadow: none; }
    .cell { break-inside: avoid; }
  }

  /* ============ アニメーション ============ */
  @keyframes viewIn { from { opacity: 0; transform: translateY(7px); } }
  @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } }
  @keyframes cellIn { from { opacity: 0; transform: translateY(9px) scale(.985); } }
  @keyframes popIn { from { opacity: 0; transform: scale(.72); } }
  @keyframes growX { from { transform: scaleX(0); opacity: .3; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: .95; }
    50% { transform: scale(1.5); opacity: .35; }
  }

  /* OS側で「視差効果を減らす」が有効なら、動きを止める */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>

<script>
// =====================================================================
// カラーテーマ
//   各テーマは UI の配色（vars）と、業務色の出し方（hue）を持つ。
//   業務マスタの「色」は名前だけを保持し、実際の色はテーマ側で決める。
// =====================================================================
var HUE_ANGLE = { '青': 214, '緑': 145, '橙': 30, '紫': 273, '赤': 6, '水色': 190, '桃': 330, '灰': 220 };

var THEMES = {
  paper: {
    name: 'ペーパー',
    hue: { barS: 68, barL: 47, softS: 72, softL: 87 },
    vars: {
      '--bg': '#ffffff', '--surface': '#ffffff', '--surface-2': '#f7f8fa', '--surface-3': '#eef0f3',
      '--text': '#202124', '--muted': '#5f6368', '--border': '#e3e6ea',
      '--accent': '#1a73e8', '--accent-soft': '#e8f0fe',
      '--danger': '#d93025', '--danger-soft': '#fce8e6', '--warn': '#e37400', '--warn-soft': '#fef7e0',
      '--shadow': '0 6px 24px rgba(0,0,0,.14)'
    }
  },
  sakura: {
    name: 'さくら',
    hue: { barS: 58, barL: 58, softS: 68, softL: 90 },

      '--bg': '#fffafb', '--surface': '#ffffff', '--surface-2': '#fdeef2', '--surface-3': '#f9dfe6',
      '--text': '#462932', '--muted': '#8a6a74', '--border': '#f4dbe2',
      '--accent': '#d4577c', '--accent-soft': '#fce7ee',
      '--danger': '#c8385a', '--danger-soft': '#fbdde5', '--warn': '#c97a2e', '--warn-soft': '#fbeedd',
      '--shadow': '0 6px 24px rgba(150,80,100,.16)'
    }
  },
  mint: {
    name: 'ミント',
    hue: { barS: 52, barL: 50, softS: 58, softL: 88 },
    vars: {
      '--bg': '#f8fdfa', '--surface': '#ffffff', '--surface-2': '#eaf6f0', '--surface-3': '#dcefe4',
      '--text': '#1f3a2e', '--muted': '#5c7a6c', '--border': '#d7eadf',
      '--accent': '#2f9e6b', '--accent-soft': '#dcf3e8',
      '--danger': '#c8433a', '--danger-soft': '#fadedb', '--warn': '#b8802a', '--warn-soft': '#f8eed8',
      '--shadow': '0 6px 24px rgba(40,110,80,.14)'
    }
  },
  ocean: {
    name: 'オーシャン',
    hue: { barS: 62, barL: 48, softS: 66, softL: 87 },
    vars: {
      '--bg': '#f6fbfe', '--surface': '#ffffff', '--surface-2': '#e8f3fa', '--surface-3': '#daebf5',
      '--text': '#16303f', '--muted': '#587888', '--border': '#d3e6f1',
      '--accent': '#1273ab', '--accent-soft': '#ddeffa',
      '--danger': '#c4443c', '--danger-soft': '#fadfdd', '--warn': '#bb7f22', '--warn-soft': '#faeed6',
      '--shadow': '0 6px 24px rgba(20,80,120,.15)'
    }
  },
  lavender: {
    name: 'ラベンダー',
    hue: { barS: 50, barL: 60, softS: 60, softL: 90 },
    vars: {
      '--bg': '#faf9fe', '--surface': '#ffffff', '--surface-2': '#efedfa', '--surface-3': '#e4e0f5',
      '--text': '#302b4a', '--muted': '#6e688c', '--border': '#e0dcf2',
      '--accent': '#6b5bd2', '--accent-soft': '#e8e4fb',
      '--danger': '#c4425f', '--danger-soft': '#fadde4', '--warn': '#b57c2c', '--warn-soft': '#f9eeda',
      '--shadow': '0 6px 24px rgba(80,70,150,.15)'
    }
  },
  sand: {
    name: 'サンド',
    hue: { barS: 46, barL: 47, softS: 52, softL: 86 },
    vars: {
      '--bg': '#fdfaf4', '--surface': '#ffffff', '--surface-2': '#f6efe1', '--surface-3': '#ece2cf',
      '--text': '#40372a', '--muted': '#7b6e59', '--border': '#e9dfc9',
      '--accent': '#a2762c', '--accent-soft': '#f5e9cf',
      '--danger': '#bb4a35', '--danger-soft': '#f8e0d9', '--warn': '#a97c20', '--warn-soft': '#f7ecd2',
      '--shadow': '0 6px 24px rgba(120,95,50,.15)'
    }
  },
  slate: {
    name: 'スレート',
    hue: { barS: 42, barL: 50, softS: 34, softL: 84 },
    vars: {
      '--bg': '#f7f8f9', '--surface': '#ffffff', '--surface-2': '#eef0f2', '--surface-3': '#e3e6e9',
      '--text': '#26303a', '--muted': '#65717d', '--border': '#dee2e6',
      '--accent': '#46647f', '--accent-soft': '#e4ebf1',
      '--danger': '#b4443c', '--danger-soft': '#f6dfdd', '--warn': '#9c7a2c', '--warn-soft': '#f4ecd8',
      '--shadow': '0 6px 24px rgba(40,55,70,.14)'
    }
  },
  night: {
    name: 'ナイト',
    hue: { barS: 55, barL: 62, softS: 30, softL: 30 },
    vars: {
      '--bg': '#15181d', '--surface': '#1e2228', '--surface-2': '#262b32', '--surface-3': '#2f353d',
      '--text': '#e6e9ed', '--muted': '#9aa4b0', '--border': '#343b45',
      '--accent': '#8ab4f8', '--accent-soft': '#2a3a52',
      '--danger': '#f28b82', '--danger-soft': '#48292a', '--warn': '#fdd663', '--warn-soft': '#4a3d1c',
      '--shadow': '0 8px 30px rgba(0,0,0,.5)'
    }
  }
};

var THEME_ORDER = ['paper', 'sakura', 'mint', 'ocean', 'lavender', 'sand', 'slate', 'night'];
var THEME_KEY = 'gyomu-schedule-theme';
var themeId = 'paper';

function loadTheme() {
  try {
    var saved = localStorage.getItem(THEME_KEY);
    if (saved && THEMES[saved]) themeId = saved;
  } catch (e) { /* プライベートウィンドウ等では読めないことがある */ }
}
function applyTheme(id, rerender) {
  if (!THEMES[id]) id = 'paper';
  themeId = id;
  var vars = THEMES[id].vars;
  Object.keys(vars).forEach(function (k) { document.documentElement.style.setProperty(k, vars[k]); });
  try { localStorage.setItem(THEME_KEY, id); } catch (e) { /* 保存できなくても動作に影響はない */ }
  renderThemeGrid();
  if (rerender && DATA) renderView();
}
/** 業務色の名前とテーマから実際の色を決める */
function hues(colorName) {
  var t = THEMES[themeId].hue;
  var h = HUE_ANGLE[colorName];
  if (h === undefined) h = HUE_ANGLE['青'];
  var gray = colorName === '灰';
  var bs = gray ? Math.round(t.barS * 0.18) : t.barS;
  var ss = gray ? Math.round(t.softS * 0.2) : t.softS;
  return {
    bar: 'hsl(' + h + ',' + bs + '%,' + t.barL + '%)',
    soft: 'hsl(' + h + ',' + ss + '%,' + t.softL + '%)'
  };
}
function renderThemeGrid() {
  var grid = document.getElementById('themeGrid');
  grid.innerHTML = '';
  THEME_ORDER.forEach(function (id) {
    var th = THEMES[id];
    var b = el('button', 'theme-card' + (id === themeId ? ' on' : ''));
    b.style.background = th.vars['--surface'];
    b.style.borderColor = id === themeId ? th.vars['--accent'] : th.vars['--border'];
    var nm = el('div', 'theme-name', th.name);
    nm.style.color = th.vars['--text'];
    b.appendChild(nm);
    var sw = el('div', 'theme-swatches');
    ['青', '緑', '橙', '桃', '紫'].forEach(function (c) {
      var i = document.createElement('i');
      var hh = HUE_ANGLE[c];
      i.style.background = 'hsl(' + hh + ',' + th.hue.barS + '%,' + th.hue.barL + '%)';
      sw.appendChild(i);
    });
    b.appendChild(sw);
    b.onclick = function () { applyTheme(id, true); };
    grid.appendChild(b);
  });
}

// =====================================================================
// 共通
// =====================================================================
var DATA = null;
var view = 'gantt';
/** A4横（297mm）から余白8mm×2 を引いた刷り幅。96dpi 換算の px */
var PRINT_W = Math.floor((297 - 16) / 25.4 * 96);   // ≒1062px
/** 同じく刷り高（210mm − 余白8mm×2） */
var PRINT_H = Math.floor((210 - 16) / 25.4 * 96);   // ≒733px
var LABEL_W = 260;                                   // ラベル列（--label-w と合わせる）
var dayW = 30;            // 1日あたりの幅。［小］［中］［大］で変わる
var laneH = 72;           // ガント1行の高さの下限。同上
var labelsOn = false;     // ガントに工程名を出すか（［工程名］ボタン。既定は出さない）
var showLabels = false;   // 実際に出しているか（印刷中は必ず出す）
var SIZE_KEY = 'schedule.size';
var LABELS_KEY = 'schedule.labels';
var hidden = {};          // 業務IDごとの表示/非表示（ガント・月間）
var query = '';           // 工程名・業務名・メモの検索語
var ownerFilter = '';     // 担当での絞り込み

/**
 * 検索と担当の絞り込み。
 * 凡例チップ（hidden）とは別に、3ビューと左パネルすべてに効かせる。
 */
function filterOn() { return !!(query || ownerFilter); }

function matchItem(item, lane) {
  if (ownerFilter && String(item.owner || '') !== ownerFilter) return false;
  if (!query) return true;
  var q = query;
  return (item.name || '').toLowerCase().indexOf(q) >= 0
    || (lane && (lane.workName || '').toLowerCase().indexOf(q) >= 0)
    || (item.note || '').toLowerCase().indexOf(q) >= 0
    || (item.owner || '').toLowerCase().indexOf(q) >= 0;
}

/** 表示対象の工程だけを返す */
function laneItems(lane) {
  if (!filterOn()) return lane.items;
  return lane.items.filter(function (it) { return matchItem(it, lane); });
}

/** 表示対象のレーン（業務を隠していない・中身が残っている） */
function visibleLanes() {
  return DATA.lanes.filter(function (l) {
    return !hidden[l.workId] && laneItems(l).length;
  });
}

/** 左パネル用。ダイジェストにも同じ絞り込みを効かせる */
function filterDigest(list) {
  return (list || []).filter(function (i) {
    if (hidden[i.workId]) return false;
    return matchItem(i, { workName: i.workName });
  });
}

function renderAll() { renderSide(); renderView(); }
var selectedWork = null;  // 業務別ビューで選択中の業務
var calMonth = null;      // 月間ビューで表示中の月 'YYYY-MM'
var expandedCells = {};
var days = [], indexOf = {}, holidayName = {}, weekendSet = {};

var WD = ['日', '月', '火', '水', '木', '金', '土'];
function toDate(k) { var p = k.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
function toKey(d) {
  var m = d.getUTCMonth() + 1, day = d.getUTCDate();
  return d.getUTCFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
}
function addDays(k, n) { var d = toDate(k); d.setUTCDate(d.getUTCDate() + n); return toKey(d); }
/** 回次の表示名。日付指定だけで組んだ工程は回次を持たない */
function periodLabel(p) { return p ? p : '日付指定'; }
function fmtShort(k) { var p = k.split('-'); return (+p[1]) + '/' + (+p[2]) + '(' + WD[toDate(k).getUTCDay()] + ')'; }
/** 印刷の吹き出し用に、曜日を省いた短い日付 */
function shortMD(k) { var p = k.split('-'); return (+p[1]) + '/' + (+p[2]); }
function fmtLong(k) {
  var p = k.split('-');
  return p[0] + '年' + (+p[1]) + '月' + (+p[2]) + '日(' + WD[toDate(k).getUTCDay()] + ')';
}
function monthOf(k) { return k.slice(0, 7); }
function shiftMonth(ym, n) {
  var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + n;
  var ny = y + Math.floor(m / 12), nm = ((m % 12) + 12) % 12 + 1;
  return ny + '-' + (nm < 10 ? '0' : '') + nm;
}
function isWeekend(k) { return !!weekendSet[toDate(k).getUTCDay()]; }
function isOff(k) { return isWeekend(k) || holidayName[k] !== undefined; }
/** k を含む週の月曜／日曜 */
function weekStart(k) { var d = toDate(k).getUTCDay(); return addDays(k, d === 0 ? -6 : 1 - d); }
function weekEnd(k) { var d = toDate(k).getUTCDay(); return addDays(k, d === 0 ? 0 : 7 - d); }
function diffDays(a, b) { return Math.round((toDate(b) - toDate(a)) / 86400000); }

/** ガントの横軸を from〜to で組み直す */
function buildDays(fromKey, toKey) {
  days = []; indexOf = {};
  var cur = fromKey;
  while (cur <= toKey && days.length < 900) {
    indexOf[cur] = days.length;
    days.push(cur);
    cur = addDays(cur, 1);
  }
}
function delay(i, step, max) {
  return Math.min(i * (step || 12), max || 420) + 'ms';
}

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

var watchdog = null;

/**
 * 失敗したことを必ず画面に出す。
 * 以前は画面側で例外が出ると「読み込み中…」の表示のまま止まり、原因が分からなかった。
 */
function showFatal(title, detail) {
  if (watchdog) { clearTimeout(watchdog); watchdog = null; }
  var c = document.getElementById('content');
  c.innerHTML = '';
  var box = el('div', 'msg-box error');
  box.setAttribute('role', 'alert');
  box.appendChild(el('div', '', title));
  if (detail) box.appendChild(el('pre', 'detail', detail));
  box.appendChild(el('div', 'hintline',
    'スプレッドシートのメニュー［📅 ' + ((DATA && DATA.title) || '業務スケジュール')
    + '］→［動作診断］を実行すると、どこで止まっているかを詳しく確認できます。'));
  c.appendChild(box);
}

/** 受け取ったデータが画面の期待どおりかを確かめる */
function validate(data) {
  if (data === null || data === undefined) {
    return 'データが空で返ってきました（' + (data === null ? 'null' : 'undefined') + '）';
  }
  if (typeof data !== 'object') return 'データが ' + typeof data + ' 型で返ってきました';
  var required = ['today', 'from', 'to', 'works', 'lanes', 'statusList'];
  for (var i = 0; i < required.length; i++) {
    if (data[required[i]] === undefined) return '「' + required[i] + '」が含まれていません';
  }
  if (typeof data.today !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(data.today)) {
    return '「today」の形式が想定と違います：' + JSON.stringify(data.today);
  }
  if (!isArray(data.lanes) || !isArray(data.works)) return '「works / lanes」が配列ではありません';
  return null;
}

function isArray(v) {
  return Object.prototype.toString.call(v) === '[object Array]';
}

/** 受信内容を確認用に短く文字列化する */
function preview(data) {
  try {
    var text = JSON.stringify(data);
    if (text === undefined) return String(data);
    return text.length > 600 ? text.slice(0, 600) + ' …（以下略）' : text;
  } catch (e) {
    return String(data);
  }
}

function load(silent) {
  if (!silent) {
    var c = document.getElementById('content');
    c.innerHTML = '';
    var l = el('div');
    l.id = 'loading';
    l.appendChild(el('div', 'spinner'));
    l.appendChild(document.createTextNode('読み込み中…'));
    c.appendChild(l);
  }

  if (watchdog) clearTimeout(watchdog);
  watchdog = setTimeout(function () {
    showFatal('サーバーからの応答がありません（90秒経過）。',
      '工程の件数が多すぎる可能性があります。\n'
      + '［設定］シートの「先読み月数」を小さくして、［工程表を再生成］を実行してみてください。');
  }, 90000);

  google.script.run
    .withSuccessHandler(function (data) {
      if (watchdog) { clearTimeout(watchdog); watchdog = null; }
      // 検証そのものが失敗することもあるので、受信後の処理はまとめて保護する
      try {
        var problem = validate(data);
        if (problem) {
          showFatal('受け取ったデータが想定と違います。',
            problem + '\n\n受信内容の先頭:\n' + preview(data));
          return;
        }
        DATA = data;
        onData();
      } catch (e) {
        showFatal('画面の描画中にエラーが発生しました。',
          (e && e.message ? e.message : String(e)) + '\n\n' + (e && e.stack ? e.stack : ''));
      }
    })
    .withFailureHandler(function (err) {
      showFatal('サーバー側の処理が失敗しました。', err && err.message ? err.message : String(err));
    })
    .getGanttData();
}

function onData() {
  document.getElementById('todayBadge').textContent = fmtLong(DATA.today) + ' 現在';

  // 見出しは［設定］シートの「スケジュール名」。ブラウザのタブ名にも出す

    document.getElementById('appTitle').textContent = DATA.title;
    try { document.title = DATA.title; } catch (e) { /* ダイアログでは変えられない */ }
  }

  // ウェブアプリとして開いているときだけ、編集画面へのリンクを出す
  var link = document.getElementById('linkEditor');
  if (DATA.editorUrl) {
    link.href = DATA.editorUrl;
    link.textContent = '工程を編集 ↗';
    link.hidden = false;
  } else {
    link.hidden = true;
  }

  holidayName = {}; weekendSet = {};
  (DATA.weekendDays || [0, 6]).forEach(function (w) { weekendSet[w] = true; });
  (DATA.holidays || []).forEach(function (h) { holidayName[h.key] = h.name; });
  buildDays(DATA.from, DATA.to);

  if (!calMonth) calMonth = monthOf(DATA.today);
  if (!selectedWork) {
    var first = DATA.works.filter(function (w) { return w.enabled; })[0];

}

function section(parent, title, color, items, kind, start) {
  if (!items || !items.length) return start;
  var h = el('div', 'group-title');
  var dot = el('span', 'dot');
  dot.style.background = color;
  h.appendChild(dot);
  h.appendChild(document.createTextNode(title + '　' + items.length + '件'));
  parent.appendChild(h);

  items.forEach(function (i, n) {
    var c = el('div', 'card ' + kind);
    c.style.animationDelay = delay(start + n, 30, 400);
    c.appendChild(el('div', 'name', i.name));
    var when = kind === 'today' ? '本日'
      : kind === 'overdue' ? fmtShort(i.dueKey) + '・' + Math.abs(i.remainingBusinessDays) + '営業日超過'
      : fmtShort(i.dueKey) + '・あと' + i.remainingBusinessDays + '営業日';
    c.appendChild(el('div', 'meta', i.workName + ' ' + periodLabel(i.period) + '\n' + when + (i.owner ? '　' + i.owner : '')));
    c.onclick = function (ev) {
      var ctx = findItem(i.workId + '|' + i.period, i.dueKey, i.name);
      if (ctx) openDetail(ev, ctx);
    };
    parent.appendChild(c);
  });
  return start + items.length;
}

function findItem(laneKey, dueKey, name) {
  var lane = null;
  DATA.lanes.forEach(function (l) { if (l.laneKey === laneKey) lane = l; });
  if (!lane) return null;
  var found = null;
  lane.items.forEach(function (it) { if (it.dueKey === dueKey && it.name === name) found = it; });
  return found ? { lane: lane, item: found } : null;
}

function renderGantt(root) {

  });
