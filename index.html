<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周知掲示板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .controls {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .last-update {
            color: #666;
            font-size: 0.9em;
        }

        .posts-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .post {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            border-left: 6px solid;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .post:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .post.priority-high {
            border-left-color: #e74c3c;
            background: #fff5f5;
        }

        .post.priority-normal {
            border-left-color: #3498db;
        }

        .post.priority-low {
            border-left-color: #95a5a6;
            background: #f8f9fa;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .post-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #2c3e50;
            flex: 1;
        }

        .priority-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            color: white;
        }

        .priority-badge.high {
            background: #e74c3c;
        }

        .priority-badge.normal {
            background: #3498db;
        }

        .priority-badge.low {
            background: #95a5a6;
        }

        .post-content {
            color: #555;
            line-height: 1.8;
            margin-bottom: 15px;
            white-space: pre-wrap;
            font-size: 1.1em;
        }

        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #888;
            font-size: 0.9em;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .post-author {
            font-weight: bold;
            color: #667eea;
        }

        .no-posts {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            color: #999;
            font-size: 1.2em;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            border-left: 6px solid #e74c3c;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
                gap: 10px;
            }

            .post-header {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📢 周知掲示板</h1>
            <p class="subtitle">重要なお知らせをお届けします</p>
        </header>

        <div class="controls">
            <button class="refresh-btn" onclick="loadPosts()">🔄 更新</button>
            <div class="last-update">最終更新: <span id="lastUpdate">読み込み中...</span></div>
        </div>

        <div id="errorContainer"></div>
        <div id="postsContainer" class="posts-container">
            <div class="no-posts">読み込み中...</div>
        </div>
    </div>

    <script>
        const DATA_FILE = 'data.json';

        function formatDate(dateString) {
            const date = new Date(dateString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${year}/${month}/${day} ${hours}:${minutes}`;
        }

        function getPriorityLabel(priority) {
            const labels = {
                'high': '重要',
                'normal': '通常',
                'low': '参考'
            };
            return labels[priority] || '通常';
        }

        function renderPosts(posts) {
            const container = document.getElementById('postsContainer');
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = '';

            if (!posts || posts.length === 0) {
                container.innerHTML = '<div class="no-posts">まだ投稿がありません</div>';
                return;
            }

            // 日付の新しい順にソート
            const sortedPosts = [...posts].sort((a, b) => {
                return new Date(b.date) - new Date(a.date);
            });

            container.innerHTML = sortedPosts.map(post => `
                <div class="post priority-${post.priority || 'normal'}">
                    <div class="post-header">
                        <div class="post-title">${escapeHtml(post.title)}</div>
                        <div class="priority-badge ${post.priority || 'normal'}">
                            ${getPriorityLabel(post.priority || 'normal')}
                        </div>
                    </div>
                    <div class="post-content">${escapeHtml(post.content)}</div>
                    <div class="post-footer">
                        <div class="post-author">投稿者: ${escapeHtml(post.author || '管理者')}</div>
                        <div class="post-date">${formatDate(post.date)}</div>
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `
                <div class="error-message">
                    <strong>エラー:</strong> ${message}
                </div>
            `;
        }

        async function loadPosts() {
            try {
                // キャッシュを回避するためにタイムスタンプを追加
                const timestamp = new Date().getTime();
                const response = await fetch(`${DATA_FILE}?t=${timestamp}`);

                if (!response.ok) {
                    throw new Error(`データファイルの読み込みに失敗しました (${response.status})`);
                }

                const data = await response.json();
                renderPosts(data.posts);

                // 最終更新時刻を表示
                const now = new Date();
                document.getElementById('lastUpdate').textContent = formatDate(now.toISOString());

            } catch (error) {
                console.error('Error loading posts:', error);
                showError('データの読み込みに失敗しました。data.jsonファイルが同じフォルダにあることを確認してください。');
                document.getElementById('postsContainer').innerHTML = '';
            }
        }

        // ページ読み込み時に投稿を読み込む
        window.addEventListener('load', loadPosts);

        // 5分ごとに自動更新
        setInterval(loadPosts, 5 * 60 * 1000);
    </script>
</body>
</html>
